<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellingborough Line — Image Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --y:#FFE100; --ydim:#C09000; --bg:#07070A; --div:#2A2A2A; --surf:#0F0F16; }
    html, body { background: var(--bg); color: var(--y); font-family: 'Courier New', monospace; font-size: 14px; }
    body { padding: 14px; }

    .page-hdr {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid var(--ydim); padding-bottom: 8px; margin-bottom: 14px;
    }
    .page-title { font-size: .82rem; letter-spacing: 3px; }
    .back-link { font-size: .7rem; letter-spacing: 2px; color: var(--ydim); text-decoration: none; }
    .back-link:hover { color: var(--y); }

    .filter-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .ftab {
      font-family: inherit; font-size: .6rem; letter-spacing: 2px;
      padding: 6px 16px; border: 1px solid var(--div); background: transparent;
      color: var(--ydim); cursor: pointer;
    }
    .ftab.active { border-color: var(--y); color: var(--y); }
    .count { font-size: .55rem; letter-spacing: 1px; color: var(--ydim); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .card { border: 1px solid var(--div); overflow: hidden; }
    .card img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; }
    .card-info { padding: 6px 8px; background: var(--surf); }
    .card-name { font-size: .62rem; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-slug { font-size: .48rem; color: var(--ydim); letter-spacing: .5px; margin-top: 2px; }
    .card-badge {
      display: inline-block; font-size: .42rem; padding: 1px 5px;
      border: 1px solid var(--div); color: var(--ydim); letter-spacing: 1px; margin-top: 4px;
    }
    .card-badge.class  { border-color: #2244AA; color: #4488FF; }
    .card-badge.livery { border-color: #AA6600; color: var(--ydim); }

    .section-hdr {
      font-size: .6rem; letter-spacing: 3px; color: var(--ydim);
      border-bottom: 1px solid var(--div); padding-bottom: 6px; margin: 18px 0 10px;
    }
  </style>
</head>
<body>

<div class="page-hdr">
  <span class="page-title">WELLINGBOROUGH LINE &nbsp;·&nbsp; IMAGE GALLERY</span>
  <a class="back-link" href="quizzes.html">◄ QUIZZES</a>
</div>

<div class="filter-row">
  <button class="ftab active" onclick="setFilter('all',this)">ALL</button>
  <button class="ftab" onclick="setFilter('class',this)">CLASS</button>
  <button class="ftab" onclick="setFilter('livery',this)">LIVERY</button>
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<script>

  { slug:'class_313',    name:'Class 313' },

  { slug:'class_319',    name:'Class 319' },
  { slug:'class_321',    name:'Class 321' },
  { slug:'class_323',    name:'Class 323' },
  { slug:'class_331',    name:'Class 331 Civity' },
  { slug:'class_333',    name:'Class 333' },
  { slug:'class_334',    name:'Class 334' },
  { slug:'class_350',    name:'Class 350 Desiro' },

  { slug:'class_360',    name:'Class 360 Desiro' },

  { slug:'class_377',    name:'Class 377 Electrostar' },
  { slug:'class_380',    name:'Class 380 Desiro' },
  { slug:'class_385',    name:'Class 385 AT200' },
  { slug:'class_387',    name:'Class 387 Electrostar' },
  { slug:'class_390',    name:'Class 390 Pendolino' },
  { slug:'class_395',    name:'Class 395 Javelin' },
  { slug:'class_444',    name:'Class 444 Desiro' },
  { slug:'class_450',    name:'Class 450 Desiro' },

const LIVERIES = [
  { slug:'livery_avanti',             name:'Avanti West Coast' },
  { slug:'livery_lner',               name:'LNER' },
  { slug:'livery_gwr',                name:'Great Western Railway' },
  { slug:'livery_emr',                name:'East Midlands Railway' },
  { slug:'livery_crosscountry',       name:'CrossCountry' },
  { slug:'livery_hull_trains',        name:'Hull Trains' },
  { slug:'livery_grand_central',      name:'Grand Central' },
  { slug:'livery_heathrow_express',   name:'Heathrow Express' },
  { slug:'livery_caledonian_sleeper', name:'Caledonian Sleeper' },
  { slug:'livery_chiltern',           name:'Chiltern Railways' },
  { slug:'livery_thameslink',         name:'Thameslink' },
  { slug:'livery_southeastern',       name:'Southeastern' },
  { slug:'livery_southern',           name:'Southern' },
  { slug:'livery_greater_anglia',     name:'Greater Anglia' },
  { slug:'livery_c2c',                name:'c2c' },
  { slug:'livery_scotrail',           name:'ScotRail' },
  { slug:'livery_transpennine',       name:'TransPennine Express' },
  { slug:'livery_northern',           name:'Northern' },
  { slug:'livery_merseyrail',         name:'Merseyrail' },
  { slug:'livery_west_midlands',      name:'West Midlands Railway' },
  { slug:'livery_tfw',                name:'Transport for Wales' },
  { slug:'livery_db_cargo',           name:'DB Cargo UK' },
  { slug:'livery_freightliner',       name:'Freightliner' },
  { slug:'livery_gbrf',               name:'GB Railfreight' },
  { slug:'livery_colas',              name:'Colas Rail' },
  { slug:'livery_drs',                name:'Direct Rail Services' },
];

let filterMode = 'all';

function setFilter(mode, btn) {
  filterMode = mode;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const grid = document.getElementById('grid');
  let html = '';
  let count = 0;

  const showClass  = filterMode !== 'livery';
  const showLivery = filterMode !== 'class';

  if (showClass) {
    if (filterMode === 'all') html += `<div class="section-hdr" style="grid-column:1/-1">CLASSES (${CLASSES.length})</div>`;
    CLASSES.forEach(e => {
      html += card(e, 'class');
      count++;
    });
  }
  if (showLivery) {
    if (filterMode === 'all') html += `<div class="section-hdr" style="grid-column:1/-1">LIVERIES (${LIVERIES.length})</div>`;
    LIVERIES.forEach(e => {
      html += card(e, 'livery');
      count++;
    });
  }

  grid.innerHTML = html;
  document.getElementById('count').textContent = count + ' images';
}

function card(e, type) {
  return `<div class="card">
    <img src="images/${e.slug}.jpg" alt="${e.name}" loading="lazy"
         onerror="this.style.opacity='.2'">
    <div class="card-info">
      <div class="card-name">${e.name}</div>
      <div class="card-slug">${e.slug}</div>
      <div class="card-badge ${type}">${type.toUpperCase()}</div>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
