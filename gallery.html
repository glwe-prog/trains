<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellingborough Line — Image Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --y:#FFE100; --ydim:#C09000; --bg:#07070A; --div:#2A2A2A; --surf:#0F0F16; }
    html, body { background: var(--bg); color: var(--y); font-family: 'Courier New', monospace; font-size: 14px; }
    body { padding: 14px; }

    .page-hdr {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid var(--ydim); padding-bottom: 8px; margin-bottom: 14px;
    }
    .page-title { font-size: .82rem; letter-spacing: 3px; }
    .back-link { font-size: .7rem; letter-spacing: 2px; color: var(--ydim); text-decoration: none; }
    .back-link:hover { color: var(--y); }

    .filter-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .ftab {
      font-family: inherit; font-size: .6rem; letter-spacing: 2px;
      padding: 6px 16px; border: 1px solid var(--div); background: transparent;
      color: var(--ydim); cursor: pointer;
    }
    .ftab.active { border-color: var(--y); color: var(--y); }
    .count { font-size: .55rem; letter-spacing: 1px; color: var(--ydim); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .card { border: 1px solid var(--div); overflow: hidden; }
    .card-img { position: relative; width: 100%; aspect-ratio: 3/2; overflow: hidden; background: #111; }
    .card-info { padding: 6px 8px; background: var(--surf); }
    .card-name { font-size: .62rem; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-slug { font-size: .48rem; color: var(--ydim); letter-spacing: .5px; margin-top: 2px; }
    .card-badge {
      display: inline-block; font-size: .42rem; padding: 1px 5px;
      border: 1px solid var(--div); color: var(--ydim); letter-spacing: 1px; margin-top: 4px;
    }
    .card-badge.class  { border-color: #2244AA; color: #4488FF; }
    .card-badge.livery { border-color: #AA6600; color: var(--ydim); }

    .section-hdr {
      font-size: .6rem; letter-spacing: 3px; color: var(--ydim);
      border-bottom: 1px solid var(--div); padding-bottom: 6px; margin: 18px 0 10px;
    }

    .card { cursor: pointer; }
    .card:hover .card-img { opacity: .85; }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.82);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg); border: 1px solid var(--ydim);
      width: min(800px, 95vw); max-height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-hdr {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid var(--div); flex-shrink: 0;
    }
    .modal-title { font-size: .72rem; letter-spacing: 2px; }
    .modal-slug  { font-size: .5rem;  letter-spacing: 1px; color: var(--ydim); margin-top: 2px; }
    .modal-close {
      font-family: inherit; font-size: .7rem; letter-spacing: 2px;
      background: transparent; border: 1px solid var(--ydim); color: var(--ydim);
      padding: 4px 12px; cursor: pointer;
    }
    .modal-close:hover { border-color: var(--y); color: var(--y); }
    .modal-img-wrap {
      position: relative; width: 100%; aspect-ratio: 4/3;
      overflow: hidden; background: #111; flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="page-hdr">
  <span class="page-title">WELLINGBOROUGH LINE &nbsp;·&nbsp; IMAGE GALLERY</span>
  <a class="back-link" href="quizzes.html">◄ QUIZZES</a>
</div>

<div class="filter-row">
  <button class="ftab active" onclick="setFilter('all',this)">ALL</button>
  <button class="ftab" onclick="setFilter('class',this)">CLASS</button>
  <button class="ftab" onclick="setFilter('livery',this)">LIVERY</button>
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-hdr">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-slug"  id="modal-slug"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕ CLOSE</button>
    </div>
    <div class="modal-img-wrap" id="modal-img-wrap"></div>
  </div>
</div>

<script src="catalogue.js?v=1788189026"></script>
<script>
const CLASSES  = CATALOGUE.filter(e => e.quizzes.class);
const LIVERIES = CATALOGUE.filter(e => e.quizzes.livery);

let filterMode = 'all';

function setFilter(mode, btn) {
  filterMode = mode;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const grid = document.getElementById('grid');
  let html = '';
  let count = 0;

  const showClass  = filterMode !== 'livery';
  const showLivery = filterMode !== 'class';

  if (showClass) {
    if (filterMode === 'all') html += `<div class="section-hdr" style="grid-column:1/-1">CLASSES (${CLASSES.length})</div>`;
    CLASSES.forEach(e => {
      html += card(e, 'class');
      count++;
    });
  }
  if (showLivery) {
    if (filterMode === 'all') html += `<div class="section-hdr" style="grid-column:1/-1">LIVERIES (${LIVERIES.length})</div>`;
    LIVERIES.forEach(e => {
      html += card(e, 'livery');
      count++;
    });
  }

  grid.innerHTML = html;
  document.getElementById('count').textContent = count + ' images';
}

function blurOverlays(cfg, id) {
  if (!cfg.blur || !cfg.blur.length) return '';
  return cfg.blur.map(([x1, y1, x2, y2]) => {
    const l = (x1 / 960 * 100).toFixed(2);
    const t = (y1 / 640 * 100).toFixed(2);
    const w = ((x2 - x1) / 960 * 100).toFixed(2);
    const h = ((y2 - y1) / 640 * 100).toFixed(2);
    const r = cfg.blurR || 10;
    return `<div style="position:absolute;left:${l}%;top:${t}%;width:${w}%;height:${h}%;overflow:hidden;pointer-events:none;">` +
      `<img src="images/${id}.jpg" style="position:absolute;width:${(10000/w).toFixed(1)}%;height:${(10000/h).toFixed(1)}%;left:${(-l/w*100).toFixed(1)}%;top:${(-t/h*100).toFixed(1)}%;filter:blur(${r}px);">` +
      `</div>`;
  }).join('');
}

function card(e, type) {
  const cfg  = e.quizzes[type] || e.quizzes.class || e.quizzes.livery;
  const name = cfg.name;
  const z    = e.zoom || 1;
  const pos  = e.pos  || '50% 50%';
  const idx  = CATALOGUE.indexOf(e);
  return `<div class="card" onclick="openModal(${idx},'${type}')">
    <div class="card-img">
      <div style="position:absolute;inset:0;transform:scale(${z});transform-origin:${pos};">
        <img src="images/${e.id}.jpg" alt="${name}" loading="lazy"
             style="width:100%;height:100%;object-fit:cover;display:block;"
             onerror="this.style.opacity='.2'">
      </div>
      ${blurOverlays(cfg, e.id)}
    </div>
    <div class="card-info">
      <div class="card-name">${name}</div>
      <div class="card-slug">${e.id}</div>
      <div class="card-badge ${type}">${type.toUpperCase()}</div>
    </div>
  </div>`;
}

function openModal(idx, type) {
  const e   = CATALOGUE[idx];
  const cfg = e.quizzes[type] || e.quizzes.class || e.quizzes.livery;
  const z   = e.zoom || 1;
  const pos = e.pos  || '50% 50%';
  document.getElementById('modal-title').textContent = cfg.name;
  document.getElementById('modal-slug').textContent  = e.id;
  const wrap = document.getElementById('modal-img-wrap');
  wrap.innerHTML =
    `<div style="position:absolute;inset:0;transform:scale(${z});transform-origin:${pos};">` +
    `<img src="images/${e.id}.jpg" style="width:100%;height:100%;object-fit:cover;display:block;">` +
    `</div>` + blurOverlays(cfg, e.id);
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
  document.getElementById('modal-img-wrap').innerHTML = '';
}

render();
</script>
</body>
</html>
