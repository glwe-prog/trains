<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blur Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font-family: monospace; padding: 16px; }
    h1 { font-size: 14px; letter-spacing: 2px; color: #FFE100; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { border: 1px solid #333; padding: 10px; }
    .label { font-size: 11px; color: #aaa; margin-bottom: 6px; line-height: 1.6; }
    .label b { color: #FFE100; }
    .img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3/2;
      overflow: hidden;
      background: #000;
    }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .quiz-type { font-size: 10px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
<h1>BLUR TEST — all entries with blur boxes</h1>
<div class="grid" id="grid"></div>

<script src="catalogue.js"></script>
<script>
function parsePosF(pos) {
  const m = (pos || '50% 50%').match(/([\d.]+)%\s+([\d.]+)%/);
  return m ? [parseFloat(m[1])/100, parseFloat(m[2])/100] : [0.5, 0.5];
}

function renderEntryImage(wrap, entry, cfg) {
  wrap.innerHTML = '';
  const z   = entry.zoom || 1;
  const pos = entry.pos  || '50% 50%';
  const container = document.createElement('div');
  container.style.cssText = `position:absolute;inset:0;transform:scale(${z});transform-origin:${pos};`;
  const img = document.createElement('img');
  img.src = `images/${entry.id}.jpg`;
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
  img.onerror = () => wrap.innerHTML = '<div style="color:#888;padding:8px;font-size:11px">NO IMAGE</div>';
  container.appendChild(img);

  if (cfg.blur && cfg.blur.length > 0) {
    const src = `images/${entry.id}.jpg`;
    cfg.blur.forEach(([x1, y1, x2, y2]) => {
      const l = x1 / 960 * 100;
      const t = y1 / 640 * 100;
      const w = (x2 - x1) / 960 * 100;
      const h = (y2 - y1) / 640 * 100;
      const bw = document.createElement('div');
      bw.style.cssText = `position:absolute;left:${l.toFixed(2)}%;top:${t.toFixed(2)}%;width:${w.toFixed(2)}%;height:${h.toFixed(2)}%;overflow:hidden;pointer-events:none;`;
      const bi = document.createElement('img');
      bi.src = src;
      bi.style.cssText = `position:absolute;display:block;width:${(10000/w).toFixed(1)}%;height:${(10000/h).toFixed(1)}%;left:${(-l/w*100).toFixed(1)}%;top:${(-t/h*100).toFixed(1)}%;filter:blur(${cfg.blurR||10}px);`;
      bw.appendChild(bi);
      container.appendChild(bw);
    });
  }
  wrap.appendChild(container);
}

const grid = document.getElementById('grid');
CATALOGUE.forEach(entry => {
  ['class', 'livery'].forEach(key => {
    const q = entry.quizzes[key];
    if (!q || !q.blur || !q.blur.length) return;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="label">
        <b>${entry.id}</b><br>
        quiz: ${key} &nbsp;|&nbsp; zoom: ${entry.zoom || 1} &nbsp;|&nbsp; pos: ${entry.pos || '50% 50%'}<br>
        boxes: ${JSON.stringify(q.blur)}<br>
        answer: ${q.name}
      </div>
      <div class="img-wrap" id="wrap-${entry.id}-${key}"></div>
    `;
    grid.appendChild(card);
    const wrap = card.querySelector('.img-wrap');
    renderEntryImage(wrap, entry, q);
  });
});
</script>
</body>
</html>
