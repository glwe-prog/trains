<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellingborough Line — Hangman</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --y: #FFE100; --ydim: #C09000; --bg: #07070A;
      --div: #2A2A2A; --grn: #44EE44; --red: #FF3030; --surf: #0F0F16;
    }
    body {
      background: var(--bg); color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh; padding: 14px;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(to bottom,
        transparent 0, transparent 3px,
        rgba(0,0,0,.08) 3px, rgba(0,0,0,.08) 4px);
      pointer-events: none; z-index: 9999;
    }

    .page-hdr {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid var(--ydim); padding-bottom: 8px;
      margin-bottom: 16px; flex-wrap: wrap; gap: 6px;
    }
    .page-title { font-size: clamp(.6rem, 2vw, .85rem); letter-spacing: 3px; }
    .back-link { font-size: clamp(.6rem, 1.8vw, .8rem); letter-spacing: 2px; color: var(--ydim); text-decoration: none; }
    .back-link:hover { color: var(--y); }

    .outer { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    /* Top row: gallows + word panel */
    .top-row {
      display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: start;
    }

    /* Gallows */
    .gallows-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    svg.gallows {
      width: 180px; height: 210px;
      stroke-linecap: round; fill: none;
    }
    svg.gallows .structure { stroke: var(--div); stroke-width: 3; }
    svg.gallows .body-part { stroke: var(--y); stroke-width: 3; transition: opacity .2s; }
    svg.gallows .body-part.hidden { opacity: 0; }
    .wrong-count { font-size: .55rem; letter-spacing: 2px; color: var(--ydim); }
    .wrong-count span { color: var(--red); }

    /* Word panel */
    .word-panel { display: flex; flex-direction: column; gap: 16px; }

    .category-label {
      font-size: .52rem; letter-spacing: 3px; color: var(--ydim);
      border: 1px solid var(--div); display: inline-block; padding: 4px 10px;
    }

    .word-display { display: flex; gap: 10px; flex-wrap: wrap; }
    .letter-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .letter-char {
      font-size: 1.7rem; line-height: 1;
      min-width: 28px; text-align: center; color: var(--y);
    }
    .letter-line { width: 28px; height: 2px; background: var(--ydim); }

    .result-banner {
      display: none; border: 1px solid var(--y); padding: 14px 18px; text-align: center;
    }
    .result-banner.show { display: block; }
    .result-banner .r-title { font-size: .9rem; letter-spacing: 4px; margin-bottom: 6px; }
    .result-banner .r-sub { font-size: .58rem; letter-spacing: 2px; color: var(--ydim); }
    .result-banner .r-sub span { color: var(--y); }

    /* Full-width keyboard */
    .keyboard { display: flex; flex-direction: column; gap: 7px; align-items: center; }
    .key-row { display: flex; gap: 6px; }
    .key {
      font-family: inherit; font-size: 1rem; letter-spacing: 1px;
      width: 58px; height: 54px; border: 1px solid var(--div);
      background: var(--surf); color: var(--ydim); cursor: pointer;
      transition: border-color .1s, color .1s, background .1s;
      display: flex; align-items: center; justify-content: center;
    }
    .key:hover:not(:disabled) { border-color: var(--y); color: var(--y); }
    .key.hit  { border-color: var(--grn); color: var(--grn); background: rgba(68,238,68,.08); }
    .key.miss { border-color: #1E1E1E; color: #2A2A2A; cursor: not-allowed; background: transparent; }
    .key:disabled { cursor: not-allowed; }

    .controls { display: flex; gap: 10px; align-items: center; }
    .btn {
      font-family: inherit; font-size: .62rem; letter-spacing: 2px;
      padding: 8px 16px; cursor: pointer;
      border: 1px solid var(--ydim); background: transparent; color: var(--ydim);
    }
    .btn:hover { border-color: var(--y); color: var(--y); }

    .footer {
      max-width: 680px; margin: 20px auto 0;
      font-size: .54rem; color: var(--ydim); letter-spacing: 2px;
      display: flex; justify-content: flex-end;
      border-top: 1px solid var(--div); padding-top: 10px;
    }

    .progress-bar { display:flex; align-items:center; gap:10px; font-size:.52rem; letter-spacing:2px; color:var(--ydim); }
    .prog-pips { display:flex; gap:4px; }
    .prog-pip { width:10px; height:10px; border:1px solid var(--div); flex-shrink:0; transition:background .2s; }
    .prog-pip.won  { background:var(--grn); border-color:var(--grn); }
    .prog-pip.lost { background:var(--red); border-color:var(--red); }

    .rating-overlay {
      display:none; position:fixed; inset:0; background:var(--bg);
      z-index:100; overflow-y:auto; padding:30px 14px;
    }
    .rating-overlay.show { display:block; }
    .rating-card {
      max-width:580px; margin:0 auto; border:1px solid var(--y); padding:30px 24px;
      text-align:center; display:flex; flex-direction:column; gap:18px;
    }
    .rating-hed { font-size:clamp(1rem,4vw,1.4rem); letter-spacing:6px; }
    .rating-badge { font-size:clamp(.9rem,3vw,1.2rem); letter-spacing:5px; color:var(--grn); }
    .rating-score-line { font-size:.65rem; letter-spacing:3px; color:var(--ydim); }
    .rating-results { display:flex; flex-direction:column; gap:5px; text-align:left; margin-top:4px; }
    .rr-row { display:grid; grid-template-columns:1.4em 1fr auto; gap:10px; align-items:baseline;
              font-size:.56rem; letter-spacing:1px; padding:5px 8px; border:1px solid transparent; }
    .rr-row.won  { border-color:rgba(68,238,68,.25); color:var(--grn); }
    .rr-row.lost { border-color:rgba(255,48,48,.25); color:var(--red); }
    .rr-n { color:var(--ydim); }
    .rr-pts { white-space:nowrap; }

    @media (max-width: 520px) {
      .top-row { grid-template-columns: 1fr; }
      .key { width: 44px; height: 44px; font-size: .85rem; }
      .key-row { gap: 4px; }
    }
  </style>
</head>

// Avoid repeating any word seen in the last 60 games (persisted across refreshes)
const RECENT_LIMIT = 60;
function pickNext() {
  const recent = new Set(JSON.parse(localStorage.getItem('hg_recent') || '[]'));
  const pool = WORDS.filter(w => !recent.has(w.word));
  const entry = (pool.length ? pool : WORDS)[Math.floor(Math.random() * (pool.length || WORDS.length))];
  const updated = [...recent, entry.word].slice(-RECENT_LIMIT);
  localStorage.setItem('hg_recent', JSON.stringify(updated));
  return entry;
}

  gamesInRound = 0; roundPoints = 0; roundResults = [];
  document.getElementById('rating-overlay').classList.remove('show');
  document.getElementById('next-btn').textContent = 'NEXT →';
  newGame();
}

function newGame() {
  const entry = pickNext();
  word = entry.word; category = entry.cat;
  guessed = new Set(); wrongCount = 0; gameOver = false;
  document.getElementById('result-banner').classList.remove('show');
  document.getElementById('prog-label').textContent =
    'WORD ' + (gamesInRound + 1) + ' / ' + ROUND_SIZE;
  renderAll();
}

function nextWord() {
  if (!gameOver) {
    // Player skipped — record as lost
    roundResults.push({ word, cat: category, won: false, pts: 0 });
    gamesInRound++;
    renderPips();
  }
  if (gamesInRound >= ROUND_SIZE) { showRating(); return; }
  newGame();
}

function renderGallows() {
  for (let i = 0; i < MAX_WRONG; i++)
    document.getElementById('p' + i).classList.toggle('hidden', i >= wrongCount);
  document.getElementById('wrong-num').textContent = wrongCount;
}

function renderWord() {
  // Group letters by word so multi-word phrases never break mid-word
  document.getElementById('word-display').innerHTML = word.split(' ').map(segment =>
    `<span style="display:flex;gap:8px;flex-shrink:0;">${
      segment.split('').map(ch =>
        `<div class="letter-box"><div class="letter-char">${guessed.has(ch) || gameOver ? ch : ' '}</div><div class="letter-line"></div></div>`
      ).join('')
    }</span>`
  ).join('<span style="min-width:20px;flex-shrink:0;"></span>');
}

function renderKeyboard() {
  document.getElementById('keyboard').innerHTML = KEY_ROWS.map(row =>
    `<div class="key-row">${row.split('').map(ch => {
      const hit  = guessed.has(ch) && word.includes(ch);
      const miss = guessed.has(ch) && !word.includes(ch);
      return `<button class="key${hit?' hit':miss?' miss':''}"
        onclick="guess('${ch}')" ${guessed.has(ch)||gameOver?'disabled':''}>${ch}</button>`;
    }).join('')}</div>`
  ).join('');
}

function renderAll() {
  document.getElementById('category-label').textContent = category;
  renderGallows(); renderWord(); renderKeyboard();
}

function renderPips() {
  const pips = Array.from({ length: ROUND_SIZE }, (_, i) => {
    const r = roundResults[i];
    const cls = r ? (r.won ? 'won' : 'lost') : '';
    return '<span class="prog-pip ' + cls + '"></span>';
  }).join('');
  document.getElementById('prog-pips').innerHTML = pips;
}

function showRating() {
  const TIERS = [
    { min: 55, badge: 'RAILWAY ENCYCLOPAEDIA' },
    { min: 45, badge: 'CHIEF INSPECTOR'        },
    { min: 35, badge: 'STATION MASTER'          },
    { min: 25, badge: 'SEASON TICKET HOLDER'    },
    { min: 15, badge: 'DAY TRIPPER'             },
    { min:  5, badge: 'LEAVES ON THE LINE'      },
    { min:  0, badge: 'SIGNAL FAILURE'          },
  ];
  const tier = TIERS.find(t => roundPoints >= t.min) || TIERS[TIERS.length - 1];
  const wonCount = roundResults.filter(r => r.won).length;
  document.getElementById('rating-badge').textContent = tier.badge;
  document.getElementById('rating-score-line').textContent =
    wonCount + ' / 10 WORDS  ·  ' + roundPoints + ' / ' + (ROUND_SIZE * MAX_WRONG) + ' POINTS';
  document.getElementById('rating-results').innerHTML = roundResults.map((r, i) =>
    '<div class="rr-row ' + (r.won ? 'won' : 'lost') + '">' +
    '<span class="rr-n">' + (i + 1) + '</span>' +
    '<span class="rr-word">' + r.word + '</span>' +
    '<span class="rr-pts">' + (r.won ? '+' + r.pts : '✕') + '</span>' +
    '</div>'
  ).join('');
  document.getElementById('rating-overlay').classList.add('show');
}

function guess(ch) {
  if (gameOver || guessed.has(ch)) return;
  guessed.add(ch);
  if (!word.includes(ch)) wrongCount++;
  const won  = word.split('').every(c => c === ' ' || guessed.has(c));
  const lost = wrongCount >= MAX_WRONG;
  if (won || lost) {
    gameOver = true; renderAll();
    const pts = won ? Math.max(0, MAX_WRONG - wrongCount) : 0;
    roundResults.push({ word, cat: category, won, pts });
    roundPoints += pts;
    gamesInRound++;
    renderPips();
    document.getElementById('r-title').textContent = won ? 'WELL DONE!' : 'GAME OVER';
    document.getElementById('r-sub').innerHTML = won
      ? 'You got it with <span>' + wrongCount + '</span> wrong guess' + (wrongCount === 1 ? '' : 'es') + ' · <span>+' + pts + ' pts</span>'
      : 'The word was <span>' + word + '</span>';
    document.getElementById('result-banner').classList.add('show');
    if (!won) renderWord();
    const isLast = gamesInRound >= ROUND_SIZE;
    document.getElementById('next-btn').textContent = isLast ? 'SEE RESULTS →' : 'NEXT →';
  } else { renderAll(); }
}

startNewRound();
</script>
<div class="rating-overlay" id="rating-overlay">
  <div class="rating-card">
    <div class="rating-hed">ROUND COMPLETE</div>
    <div class="rating-badge" id="rating-badge"></div>
    <div class="rating-score-line" id="rating-score-line"></div>
    <div class="rating-results" id="rating-results"></div>
    <button class="btn" onclick="startNewRound()" style="margin-top:6px;">PLAY AGAIN</button>
  </div>
</div>
</body>
</html>
