<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellingborough Line — Piece by Piece</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --y: #FFE100; --ydim: #C09000; --bg: #07070A;
      --div: #2A2A2A; --grn: #44EE44; --red: #FF3030; --surf: #0F0F16;
    }
    body {
      background: var(--bg); color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh; padding: 14px;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(to bottom,
        transparent 0, transparent 3px,
        rgba(0,0,0,.08) 3px, rgba(0,0,0,.08) 4px);
      pointer-events: none; z-index: 9999;
    }

    .page-hdr {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid var(--ydim); padding-bottom: 8px;
      margin-bottom: 14px; flex-wrap: wrap; gap: 6px;
    }
    .page-title { font-size: clamp(.6rem, 2vw, .82rem); letter-spacing: 3px; }
    .back-link  { font-size: clamp(.6rem, 1.8vw, .78rem); letter-spacing: 2px; color: var(--ydim); text-decoration: none; }
    .back-link:hover { color: var(--y); }

    .container { max-width: 640px; margin: 0 auto; }

    /* ── Image + grid ── */
    .img-wrap {
      position: relative; width: 100%; aspect-ratio: 3/2;
      border: 1px solid var(--div); overflow: hidden; background: #111; margin-bottom: 0;
    }
    .img-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      object-position: center; display: block;
    }
    #grid-overlay {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
    }
    .g-cell {
      background: var(--bg); cursor: pointer;
      transition: opacity .32s ease;
      border: 1px solid #111;
    }
    .g-cell:hover { background: #1A1A28; }
    .g-cell.revealed { opacity: 0; pointer-events: none; cursor: default; }
    .g-cell.popping  { animation: pop .32s ease forwards; }
    @keyframes pop {
      0%   { opacity: 1; background: var(--ydim); }
      35%  { opacity: 1; background: var(--ydim); }
      100% { opacity: 0; }
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .6rem; letter-spacing: 2px; color: var(--ydim);
      border: 1px solid var(--div); border-top: none;
      padding: 6px 10px; margin-bottom: 12px;
    }
    .attempts { display: flex; gap: 6px; align-items: center; }
    .attempt-pip {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--y); border: 1px solid var(--ydim);
      transition: background .2s, border-color .2s;
    }
    .attempt-pip.used { background: #1A0000; border-color: var(--red); }
    .revealed-count { color: var(--y); }

    /* ── Question ── */
    .question {
      font-size: clamp(.72rem, 2.2vw, .9rem); letter-spacing: 2px; margin-bottom: 10px;
    }

    /* ── Options ── */
    .options {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px;
    }
    .opt-btn {
      background: transparent; border: 1px solid var(--ydim);
      color: var(--y); font-family: inherit;
      font-size: clamp(.62rem, 1.8vw, .8rem); letter-spacing: 1px;
      padding: 11px 12px; cursor: pointer; text-align: left;
      display: flex; gap: 8px; align-items: flex-start; line-height: 1.4;
      transition: border-color .12s, background .12s;
    }
    .opt-btn:hover:not(:disabled):not(.eliminated) {
      border-color: var(--y); background: rgba(255,225,0,.05);
    }
    .opt-btn .ltr { color: var(--ydim); flex-shrink: 0; }
    .opt-btn.correct  { border-color: var(--grn) !important; color: var(--grn) !important; background: rgba(68,238,68,.1) !important; }
    .opt-btn.correct .ltr { color: var(--grn); }
    .opt-btn.wrong    { animation: shake .32s ease; border-color: var(--red) !important; color: var(--red) !important; }
    .opt-btn.wrong .ltr { color: var(--red); }
    .opt-btn.eliminated { opacity: .28; cursor: default; border-color: var(--div); color: var(--div); }
    .opt-btn:disabled   { cursor: default; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 60%{transform:translateX(5px)}
    }

    /* ── Result ── */
    .result {
      display: none; font-size: .78rem; letter-spacing: 2px;
      padding: 10px 14px; margin-bottom: 12px;
    }
    .result.win  { display: block; border: 1px solid var(--grn); color: var(--grn); }
    .result.loss { display: block; border: 1px solid var(--red); color: var(--red); }

    /* ── Controls ── */
    .controls { display: flex; gap: 10px; align-items: center; }
    .btn {
      font-family: inherit; font-size: .62rem; letter-spacing: 2px;
      padding: 8px 18px; cursor: pointer;
      border: 1px solid var(--y); background: transparent; color: var(--y);
    }
    .btn:hover { background: rgba(255,225,0,.08); }
    #btn-next { display: none; }

    .progress-row {
      display: flex; justify-content: space-between;
      font-size: .6rem; letter-spacing: 2px; color: var(--ydim);
      margin-bottom: 8px;
    }
    .progress-row span { color: var(--y); }

    #results-panel {
      border: 1px solid var(--ydim);
      padding: clamp(20px, 6vw, 44px);
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }
    .res-score { font-size: clamp(3rem, 10vw, 5rem); letter-spacing: 6px; margin-bottom: 10px; }
    .res-msg   { font-size: clamp(.85rem, 2.5vw, 1.1rem); letter-spacing: 2px; margin-bottom: 8px; }
    .res-sub   { font-size: .7rem; letter-spacing: 2px; color: var(--ydim); margin-bottom: 26px; line-height: 1.8; }

    .mode-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .mode-btn {
      font-family: inherit; font-size: .55rem; letter-spacing: 2px;
      padding: 5px 14px; border: 1px solid var(--div); background: transparent;
      color: var(--ydim); cursor: pointer;
    }
    .mode-btn.active { border-color: var(--y); color: var(--y); }

    .back-links {
      display: flex; justify-content: space-between; margin-top: 16px; flex-wrap: wrap; gap: 6px;
    }
  </style>
</head>
<body>

<div class="page-hdr">
  <span class="page-title">WELLINGBOROUGH LINE &nbsp;·&nbsp; PIECE BY PIECE</span>
  <a class="back-link" href="quizzes.html">◄ QUIZZES</a>
</div>

<div class="container">

  <div class="mode-row">
    <button class="mode-btn active" id="mode-random" onclick="setMode('random',this)">RANDOM</button>
    <button class="mode-btn" id="mode-class"  onclick="setMode('class',this)">CLASS</button>
    <button class="mode-btn" id="mode-livery" onclick="setMode('livery',this)">LIVERY</button>
  </div>

  <div class="progress-row">
    <span>ROUND <span id="round-num">1</span> / 10</span>
    <span>SCORE <span id="score-num">0</span> / 10</span>
  </div>

  <div class="img-wrap">
    <div id="img-container" style="position:absolute;inset:0;"></div>
    <div id="grid-overlay"></div>
  </div>

  <div class="status-bar">
    <span>REVEALED: <span class="revealed-count" id="revealed-count">0</span> / 16</span>
    <span>ATTEMPTS LEFT: <span class="attempts" id="attempts-row"></span></span>
    <button class="btn" onclick="nextRound()" style="font-size:.52rem;padding:4px 10px;border-color:var(--ydim);color:var(--ydim)">SKIP</button>
  </div>

  <div class="question" id="question">WHAT IS THIS?</div>
  <div class="options" id="options"></div>
  <div class="result" id="result"></div>

  <div class="controls">
    <button class="btn" id="btn-next" onclick="nextRound()">NEXT →</button>
  </div>

  <div id="results-panel">
    <div class="res-score" id="res-score"></div>
    <div class="res-msg"   id="res-msg"></div>
    <div class="res-sub"   id="res-sub"></div>
    <button class="btn" onclick="startGame()">▶ PLAY AGAIN</button>
  </div>

  <div class="back-links">
    <a href="quizzes.html" class="back-link">◄ QUIZ MENU</a>
    <a href="index.html"   class="back-link">LIVE TRAIN BOARD ►</a>
  </div>

</div>

<script src="catalogue.js?v=1787122070"></script>
<script>
const CLASSES  = CATALOGUE.filter(e => e.quizzes.class);
const LIVERIES = CATALOGUE.filter(e => e.quizzes.livery);

function renderEntryImage(container, entry, cfg) {
  container.innerHTML = '';
  const z   = entry.zoom || 1;
  const pos = entry.pos  || '50% 50%';
  const inner = document.createElement('div');
  inner.style.cssText = `position:absolute;inset:0;transform:scale(${z});transform-origin:${pos};`;
  const img = document.createElement('img');
  img.src = `images/${entry.id}.jpg`;
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
  inner.appendChild(img);
  if (cfg.blur && cfg.blur.length > 0) {
    const src = `images/${entry.id}.jpg`;
    cfg.blur.forEach(([x1, y1, x2, y2]) => {
      const l = x1 / 960 * 100;
      const t = y1 / 640 * 100;
      const w = (x2 - x1) / 960 * 100;
      const h = (y2 - y1) / 640 * 100;
      const bw = document.createElement('div');
      bw.style.cssText = `position:absolute;left:${l.toFixed(2)}%;top:${t.toFixed(2)}%;width:${w.toFixed(2)}%;height:${h.toFixed(2)}%;overflow:hidden;pointer-events:none;`;
      const bi = document.createElement('img');
      bi.src = src;
      bi.style.cssText = `position:absolute;display:block;width:${(10000/w).toFixed(1)}%;height:${(10000/h).toFixed(1)}%;left:${(-l/w*100).toFixed(1)}%;top:${(-t/h*100).toFixed(1)}%;filter:blur(${cfg.blurR||10}px);`;
      bw.appendChild(bi);
      inner.appendChild(bw);
    });
  }
  container.appendChild(inner);
}

const COLS = 4, ROWS = 4, TOTAL = COLS * ROWS;
const MAX_ATTEMPTS = 5;
const MIN_REVEALS = 3;
const LABELS = ['A','B','C','D','E','F'];

let current = null, currentCfg = null, pool = [], revealOrder = [];
let revealedCount = 0, attemptsLeft = MAX_ATTEMPTS, locked = false;
let quizMode = 'random'; // 'random' | 'class' | 'livery'
let useClassMode = true;

const MAX_ROUNDS = 10;
let roundNum = 0;
let gameScore = 0;

function setMode(mode, btn) {
  quizMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  startGame();
}

function startGame() {
  roundNum = 0;
  gameScore = 0;
  document.getElementById('results-panel').style.display = 'none';
  document.getElementById('score-num').textContent = '0';
  newRound();
}

function nextRound() {
  if (roundNum >= MAX_ROUNDS) {
    showFinalResults();
  } else {
    newRound();
  }
}

function showFinalResults() {
  document.getElementById('results-panel').style.display = 'block';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('result').className = 'result';
  const pct = gameScore / MAX_ROUNDS;
  let msg, colour;
  if (pct === 1)       { msg = '★  PERFECT — True expert!';                colour = 'var(--grn)'; }
  else if (pct >= 0.8) { msg = 'EXCELLENT — Sharp eyes!';                  colour = 'var(--grn)'; }
  else if (pct >= 0.6) { msg = 'GOOD EFFORT — Keep practising!';           colour = 'var(--y)';   }
  else if (pct >= 0.4) { msg = 'NOT BAD — More platform time needed!';     colour = 'var(--ora)'; }
  else                 { msg = 'KEEP PRACTISING — Hit the platform!';      colour = 'var(--red)'; }
  document.getElementById('res-score').textContent = `${gameScore} / ${MAX_ROUNDS}`;
  document.getElementById('res-score').style.color = colour;
  document.getElementById('res-msg').textContent   = msg;
  document.getElementById('res-sub').textContent   = `${gameScore} correct out of ${MAX_ROUNDS} questions`;
}

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function newRound() {
  roundNum++;
  document.getElementById('round-num').textContent = roundNum;
  // Pick a type based on mode
  useClassMode = quizMode === 'class' ? true : quizMode === 'livery' ? false : Math.random() < 0.5;
  pool = useClassMode ? CLASSES : LIVERIES;
  if (!pool.length) return;

  current    = pool[Math.floor(Math.random() * pool.length)];
  currentCfg = useClassMode ? current.quizzes.class : current.quizzes.livery;
  revealedCount = 0;
  attemptsLeft = MAX_ATTEMPTS;
  locked = false;

  // Load image
  renderEntryImage(document.getElementById('img-container'), current, currentCfg);

  // Build grid
  const overlay = document.getElementById('grid-overlay');
  overlay.innerHTML = '';
  revealOrder = shuffle([...Array(TOTAL).keys()]);
  for (let i = 0; i < TOTAL; i++) {
    const cell = document.createElement('div');
    cell.className = 'g-cell';
    cell.id = `gc-${i}`;
    cell.addEventListener('click', () => revealCell(i));
    overlay.appendChild(cell);
  }

  // Options: correct + 5 wrong from same pool, locked until MIN_REVEALS cells uncovered
  const wrong = shuffle(pool.filter(p => p.id !== current.id)).slice(0, 5)
                  .map(p => useClassMode ? p.quizzes.class.name : p.quizzes.livery.name);
  const opts  = shuffle([currentCfg.name, ...wrong]);
  document.getElementById('options').innerHTML = opts.map((n, i) =>
    `<button class="opt-btn" data-name="${n}" onclick="handleAnswer(this)" disabled>
      <span class="ltr">${LABELS[i]}.</span><span>${n}</span>
    </button>`
  ).join('');
  document.getElementById('question').innerHTML =
    (useClassMode ? 'WHAT CLASS IS THIS?' : 'WHOSE LIVERY IS THIS?') +
    ` <span id="reveal-hint" style="font-size:.55rem;color:var(--ydim);letter-spacing:1px"> — REVEAL ${MIN_REVEALS} CELLS TO GUESS</span>`;

  // Pips
  renderPips();

  // Status
  document.getElementById('revealed-count').textContent = '0';
  document.getElementById('result').className = 'result';
  document.getElementById('result').textContent = '';
  document.getElementById('btn-next').style.display = 'none';
}

function revealCell(idx) {
  if (locked) return;
  const cell = document.getElementById(`gc-${idx}`);
  if (cell.classList.contains('revealed') || cell.classList.contains('popping')) return;
  cell.classList.add('popping');
  cell.addEventListener('animationend', () => {
    cell.classList.remove('popping');
    cell.classList.add('revealed');
  }, { once: true });
  revealedCount++;
  document.getElementById('revealed-count').textContent = revealedCount;
  if (revealedCount >= MIN_REVEALS) {
    document.querySelectorAll('.opt-btn:not(.eliminated)').forEach(b => b.disabled = false);
    const hint = document.getElementById('reveal-hint');
    if (hint) hint.remove();
  }
}

function revealAll(delay) {
  const cells = document.querySelectorAll('.g-cell:not(.revealed)');
  cells.forEach((cell, i) => {
    setTimeout(() => {
      cell.classList.add('popping');
      cell.addEventListener('animationend', () => {
        cell.classList.remove('popping');
        cell.classList.add('revealed');
      }, { once: true });
    }, delay + i * 22);
  });
}

function renderPips() {
  document.getElementById('attempts-row').innerHTML =
    Array.from({length: MAX_ATTEMPTS}, (_, i) =>
      `<div class="attempt-pip${i < (MAX_ATTEMPTS - attemptsLeft) ? ' used' : ''}"></div>`
    ).join('');
}

function handleAnswer(btn) {
  if (locked || btn.classList.contains('eliminated')) return;
  const chosen = btn.getAttribute('data-name');

  if (chosen === currentCfg.name) {
    gameScore++;
    document.getElementById('score-num').textContent = gameScore;
    locked = true;
    btn.classList.add('correct');
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    revealAll(160);
    const res = document.getElementById('result');
    res.textContent = '✓ CORRECT! ' + currentCfg.name.toUpperCase();
    res.className = 'result win';
    const nb = document.getElementById('btn-next');
    nb.textContent = roundNum >= MAX_ROUNDS ? 'SEE RESULTS →' : 'NEXT →';
    nb.style.display = 'inline-block';
  } else {
    attemptsLeft--;
    btn.classList.add('wrong');
    btn.disabled = true;
    const cleanup = () => {
      btn.classList.remove('wrong');
      btn.classList.add('eliminated');
    };
    btn.addEventListener('animationend', cleanup, { once: true });
    setTimeout(cleanup, 400);
    renderPips();

    if (attemptsLeft <= 0) {
      locked = true;
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      revealAll(200);
      const res = document.getElementById('result');
      res.textContent = '✗ OUT OF ATTEMPTS — ' + currentCfg.name.toUpperCase();
      res.className = 'result loss';
      const nb2 = document.getElementById('btn-next');
      nb2.textContent = roundNum >= MAX_ROUNDS ? 'SEE RESULTS →' : 'NEXT →';
      nb2.style.display = 'inline-block';
    }
  }
}

startGame();
</script>
</body>
</html>
