<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellingborough Line — Live Trains</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --y:    #FFE100;
      --ydim: #C09000;
      --bg:   #07070A;
      --div:  #2A2A2A;
      --grn:  #44EE44;
      --red:  #FF3030;
      --ora:  #FF9900;
    }

    body {
      background: var(--bg);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      padding: 14px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 3px,
        rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Header ──────────────────────────── */
    .page-hdr {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--ydim);
      padding-bottom: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .page-title { font-size: clamp(0.6rem, 2vw, 0.85rem); letter-spacing: 3px; color: var(--y); }
    .page-clock { font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: 5px; }

    /* ── Panels — always stacked vertically ─ */
    .panels {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }

    .display { border: 1px solid var(--ydim); padding: clamp(10px, 3vw, 20px); }

    .dir-bar {
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      letter-spacing: 3px;
      color: var(--y);
      border-bottom: 1px solid var(--div);
      padding-bottom: 7px;
      margin-bottom: 10px;
    }

    /* ── Main train row ───────────────────── */
    .row1 {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 5px;
      overflow: hidden;
    }
    .r1-time { font-size: clamp(1.6rem, 5vw, 2.4rem); letter-spacing: 2px; white-space: nowrap; flex-shrink: 0; }
    .r1-dest { font-size: clamp(1.1rem, 3.5vw, 1.8rem); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r1-exp  { font-size: clamp(0.75rem, 2vw, 1rem); white-space: nowrap; flex-shrink: 0; }
    .r1-exp.ontime { color: var(--grn); }
    .r1-exp.late   { color: var(--red); }
    .r1-exp.early  { color: var(--ora); }

    /* ── Stops vs passes badge ────────────── */
    .stop-badge {
      display: inline-block;
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      letter-spacing: 2px;
      padding: 2px 8px;
      border-radius: 2px;
      margin-bottom: 8px;
    }
    .stop-badge.stops   { background: var(--y); color: #000; }
    .stop-badge.passes  { border: 1px solid var(--ydim); color: var(--ydim); }

    /* ── Calling at (scrolling) ───────────── */
    .calling-wrap {
      display: flex;
      align-items: center;
      overflow: hidden;
      height: 1.4em;
      margin-bottom: 8px;
    }
    .calling-label {
      flex-shrink: 0;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      color: var(--ydim);
      margin-right: 6px;
    }
    .calling-ticker {
      flex: 1;
      overflow: hidden;
      position: relative;
      height: 100%;
    }
    .calling-text {
      position: absolute;
      top: 0;
      white-space: nowrap;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      line-height: 1.4em;
    }

    /* ── Class row ────────────────────────── */
    .row3 {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.65rem, 1.8vw, 0.85rem);
      flex-wrap: wrap;
      gap: 4px;
    }
    .r3-class  { color: var(--ydim); letter-spacing: 1px; }
    .r3-status { letter-spacing: 2px; }
    .r3-status.ontime    { color: var(--grn); }
    .r3-status.late      { color: var(--red); }
    .r3-status.cancelled { color: var(--red); text-decoration: line-through; }
    .r3-status.early     { color: var(--ora); }

    /* ── States ───────────────────────────── */
    .state { font-size: 0.72rem; letter-spacing: 3px; color: var(--ydim); padding: 14px 0; }

    /* ── Smooth panel transition ──────────── */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .panel-enter {
      animation: fade-in 0.35s ease forwards;
    }

    /* ── Footer ───────────────────────────── */
    .footer {
      margin-top: 12px;
      font-size: 0.58rem;
      color: var(--ydim);
      letter-spacing: 2px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="page-hdr">
  <div class="page-title">EAST MIDLANDS RAILWAY &nbsp;·&nbsp; GREAT CENTRAL LINE &nbsp;·&nbsp; MIDLAND MAIN LINE &nbsp;·&nbsp; WELLINGBOROUGH LINE &nbsp;·&nbsp; LOUIE LINE</div>
  <div class="page-clock" id="clock">--:--:--</div>
</div>

<div class="panels">
  <div class="display">
    <div class="dir-bar">▲ &nbsp;NORTHBOUND &nbsp;·&nbsp; LEICESTER &nbsp;·&nbsp; NOTTINGHAM &nbsp;·&nbsp; SHEFFIELD</div>
    <div id="north-body"><div class="state">FETCHING…</div></div>
  </div>
  <div class="display">
    <div class="dir-bar">▼ &nbsp;SOUTHBOUND &nbsp;·&nbsp; LONDON ST PANCRAS</div>
    <div id="south-body"><div class="state">FETCHING…</div></div>
  </div>
</div>

<div class="footer" id="footer">—</div>

<script>
  // ── Strategy ───────────────────────────────────────────────────────
  // Darwin only knows about trains that STOP at a station.
  // To see ALL trains passing Wellingborough (including expresses that
  // don't stop), we query the neighbouring stations:
  //   NORTHBOUND — query Bedford (BDM): northbound departures that will
  //                pass through Wellingborough on their way north.
  //   SOUTHBOUND — query Kettering (KTR): southbound departures that will
  //                pass through Wellingborough on their way south.
  // For each train we check if Wellingborough is in its calling points
  // (it stops) or not (it passes through). Times are exact if stopping,
  // estimated if passing (BDM→WBO ≈ 11 min, KTR→WBO ≈ 6 min).

  const REFRESH_MS  = 60_000;
  const DISPLAY_MS  = 15_000;   // how often to re-filter cached data without an API call
  const EMR_CODE    = 'EM';

  // ── RTT credentials ────────────────────────────────────────────────
  // Register at https://api-portal.rtt.io  (9,000 requests/day free tier)
  // Leave blank to use heuristic-only class detection.
  const RTT_TOKEN = '06d0b3b2-b937-4c50-b375-38fb18e201cb';
  const RTT_REFRESH_MS = 10 * 60_000;  // refresh class data every 10 min

  // Cache of all upcoming trains, kept between API refreshes
  let cachedNorth = [];
  let cachedSouth = [];

  // RTT class cache: "CRS:HHMM" → friendly class string (e.g. "Class 810 Aurora")
  const rttClassCache = new Map();

  // Approximate travel time in minutes from query station to Wellingborough
  const NORTH_STA = { crs: 'BDM', offsetMins: 11 };  // Bedford  → WBO
  const SOUTH_STA = { crs: 'KET', offsetMins:  6 };  // Kettering → WBO

  function apiUrl(crs) {
    return `https://huxley2.azurewebsites.net/departures/${crs}/20?expand=true`;
  }

  // ── Helpers ────────────────────────────────────────────────────────
  function addMins(timeStr, mins) {
    try {
      const [h, m] = timeStr.split(':').map(Number);
      const t = h * 60 + m + mins;
      return `${String(Math.floor(t / 60) % 24).padStart(2,'0')}:${String(t % 60).padStart(2,'0')}`;
    } catch (_) { return timeStr; }
  }

  function toMins(timeStr) {
    try { const [h,m] = timeStr.split(':').map(Number); return h*60+m; }
    catch (_) { return 0; }
  }

  // Is this train heading north (towards Leicester / Nottingham)?
  // Check destination name — more reliable than CRS code sets.
  function isNorthbound(svc) {
    const dest = (svc.destination?.[0]?.locationName || '').toLowerCase();
    return /leicester|nottingham|sheffield|derby|loughborough|kettering|corby|market harborough|chesterfield|long eaton|beeston/.test(dest);
  }

  // Is this train heading south (towards London)?
  function isSouthbound(svc) {
    const dest = (svc.destination?.[0]?.locationName || '').toLowerCase();
    return /london|pancras|bedford|luton|st albans|flitwick|harlington|leagrave/.test(dest);
  }

  // ── RTT NG class lookup ────────────────────────────────────────────
  // Map a raw class string ("810", "222", "360/2", etc.) to a friendly label.
  function classToLabel(cls) {
    const c = (cls || '').toString().trim();
    if (c.startsWith('810')) return 'Class 810 Aurora';
    if (c.startsWith('222')) return 'Class 222 Meridian';
    if (c.startsWith('360')) return 'Class 360 Desiro';
    if (c.startsWith('158')) return 'Class 158 Express Sprinter';
    if (c.startsWith('180')) return 'Class 180 Adelante';
    if (c) return `Class ${c}`;
    return null;
  }

  // Extract scheduled departure as "HHMM" from a RTT NG location lineup entry.
  function rttNgDep(svc) {
    const iso = svc.temporalData?.scheduledDeparture
             || svc.temporalData?.scheduledPass;
    if (!iso) return null;
    const m = iso.match(/T(\d{2}):(\d{2})/);
    return m ? m[1] + m[2] : null;   // "0930"
  }

  // Build a friendly class + unit string from an allocation entry.
  // Returns e.g. "Class 810 Aurora · 810 109" or "Class 222 Meridian" or null.
  function parseAllocationLabel(alloc) {
    if (!alloc) return null;
    const label = alloc.leadingClass ? classToLabel(alloc.leadingClass) : null;
    const units = (alloc.allocationItems || [])
      .map(u => (u.identity || '').toString().trim())
      .filter(Boolean)
      .map(id => id.replace(/^(\d{3})(\d+)$/, '$1 $2'));  // "810109" → "810 109"
    if (!label && !units.length) return null;
    if (label && units.length) return `${label} · ${units.join(' + ')}`;
    if (label) return label;
    // No leadingClass but have a unit number — derive class from first digits
    const first = (alloc.allocationItems?.[0]?.identity || '').toString();
    return first ? classToLabel(first.substring(0, 3)) : null;
  }

  // Fetch full service detail for one train and cache its class/unit string.
  // uniqueIdentity format: "L01525:2025-10-26"
  async function fetchServiceClass(uniqueIdentity, cacheKey) {
    try {
      const res = await fetch(
        `https://data.rtt.io/gb-nr/service?uniqueIdentity=${encodeURIComponent(uniqueIdentity)}`,
        { headers: { Authorization: `Bearer ${RTT_TOKEN}` } }
      );
      if (!res.ok) return;
      const data = await res.json();
      const allocations = data.service?.allocationData || [];
      // Pick the first allocation (formation at origin / before any split)
      const label = parseAllocationLabel(allocations[0]);
      if (label) rttClassCache.set(cacheKey, label);
      // Display updates on next natural 15s tick — no race condition
    } catch (_) { /* non-fatal */ }
  }

  // Fetch RTT location lineup for a station, then sequentially fetch
  // service-detail for any services not already in the class cache.
  // Sequential (not parallel) to avoid flooding the RTT API.
  async function fetchRttClasses(crs) {
    if (!RTT_TOKEN) return;
    try {
      const res = await fetch(
        `https://data.rtt.io/gb-nr/location?code=${crs}&timeWindow=120`,
        { headers: { Authorization: `Bearer ${RTT_TOKEN}` } }
      );
      if (!res.ok) return;
      const data = await res.json();
      const svcs = data.services || [];
      for (const svc of svcs) {
        const dep = rttNgDep(svc);
        const uid = svc.scheduleMetadata?.uniqueIdentity;
        if (!dep || !uid) continue;
        const key = `${crs}:${dep}`;
        if (!rttClassCache.has(key)) {
          await fetchServiceClass(uid, key);
          // Small gap between calls — stays well within RTT's 30 req/min limit
          await new Promise(r => setTimeout(r, 300));
        }
      }
    } catch (_) { /* RTT errors are non-fatal */ }
  }

  // Refresh RTT class cache for both query stations.
  async function refreshRtt() {
    await Promise.all([
      fetchRttClasses(NORTH_STA.crs),
      fetchRttClasses(SOUTH_STA.crs),
    ]);
  }

  // Resolve class for a display-ready enriched record.
  // Uses RTT cache if populated; falls back to heuristic getClass().
  function resolveClass(enriched) {
    const cached = rttClassCache.get(enriched.rttKey);
    if (cached) return cached;
    return getClass(enriched.svc);
  }

  function getClass(svc) {
    const stops = (svc.subsequentCallingPoints?.[0]?.callingPoint || []).length;
    const dest  = (svc.destination?.[0]?.locationName || '').toLowerCase();
    const orig  = (svc.origin?.[0]?.locationName      || '').toLowerCase();

    // Bedford ↔ Corby stopping service = Class 360 Desiro (4 or 8 car)
    const is360Route = dest.includes('corby') || orig.includes('corby')
      || (dest.includes('bedford') && stops >= 3)
      || (orig.includes('bedford') && stops >= 3 && !dest.includes('pancras')
          && !dest.includes('nottingham') && !dest.includes('sheffield')
          && !dest.includes('derby'));
    if (is360Route) return 'Class 360 Desiro (4 or 8 car)';

    // Fast intercity = Class 810 Aurora or Class 222 Meridian
    const isFast = stops <= 6
      || dest.includes('sheffield') || dest.includes('nottingham')
      || dest.includes('st pancras') || dest.includes('derby');
    if (isFast) return 'Class 810 Aurora / 222 Meridian';

    // Anything else stopping on the MML
    return 'Class 360 Desiro';
  }

  function getStatus(svc, wboEntry) {
    if (svc.isCancelled) return { text: 'CANCELLED', cls: 'cancelled' };
    if (wboEntry) {
      const at = wboEntry.at || '';
      if (!at || at === 'On time') return { text: 'On time',  cls: 'ontime' };
      if (at === 'Cancelled')      return { text: 'Cancelled', cls: 'cancelled' };
      return { text: `Exp ${at}`, cls: 'late' };
    }
    // No WBO entry — use overall service status
    const est = svc.etd || svc.eta || '';
    if (!est || est === 'On time') return { text: 'On time', cls: 'ontime' };
    if (est === 'Cancelled')       return { text: 'Cancelled', cls: 'cancelled' };
    return { text: `Exp ${est}`, cls: 'late' };
  }

  function expLabel(wboTime, wboEntry, svc) {
    if (svc.isCancelled) return { text: 'Cancelled', cls: 'late' };
    if (wboEntry) {
      const at = wboEntry.at || '';
      if (!at || at === 'On time') return { text: `Exp ${wboTime}`, cls: 'ontime' };
      if (at === 'Cancelled')      return { text: 'Cancelled', cls: 'late' };
      return { text: `Exp ${at}`, cls: 'late' };
    }
    return { text: `~${wboTime} est`, cls: '' };
  }

  // ── Enrich a service with WBO passing/stop data ────────────────────
  function enrichWithWBO(svc, crs, offsetMins) {
    const deptTime = svc.std || svc.etd || '??:??';
    const cp       = svc.subsequentCallingPoints?.[0]?.callingPoint || [];
    const wboEntry = cp.find(p => p.crs === 'WEL');

    const wboTime    = wboEntry ? wboEntry.st : addMins(deptTime, offsetMins);
    const stopsAtWBO = !!wboEntry;

    // Calling points to show: all stops AFTER the origin station
    const callingStr = cp.map(p => p.locationName).join('   ·   ');

    // RTT cache key: "CRS:HHMM" — matches RTT's gbttBookedDeparture field
    const rttKey = `${crs}:${deptTime.replace(':', '')}`;

    return { svc, wboTime, wboEntry, stopsAtWBO, callingStr, rttKey };
  }

  // ── Marquee animation ──────────────────────────────────────────────
  // Always scrolls calling points (like a real departure board), using the
  // Web Animations API which is more reliable than CSS transitions.
  function startMarquee(ticker) {
    const text = ticker.querySelector('.calling-text');
    if (!text) return;

    // Cancel any previous animation on this element
    text.getAnimations().forEach(a => a.cancel());
    text.style.left = '0px';

    // Short delay so layout + fonts are settled
    setTimeout(() => {
      const tw = ticker.offsetWidth;
      const iw = text.scrollWidth;
      if (!tw || !iw) return;

      const durMs = ((tw + iw) / 80) * 1000;   // 80px/s

      text.animate(
        [{ left: `${tw}px` }, { left: `${-iw}px` }],
        { duration: durMs, delay: 1200, iterations: Infinity,
          easing: 'linear', fill: 'backwards' }
      );
    }, 200);
  }

  function initMarquees() {
    document.querySelectorAll('.calling-ticker').forEach(startMarquee);
  }

  // Track which train is currently shown per panel to detect changes
  const _shown = {};

  // ── Render ─────────────────────────────────────────────────────────
  function renderPanel(enriched, elId) {
    const el = document.getElementById(elId);

    if (!enriched) {
      if (_shown[elId] !== 'none') {
        _shown[elId] = 'none';
        el.innerHTML = '<div class="state panel-enter">NO UPCOMING EMR SERVICE</div>';
      }
      return;
    }

    const { svc, wboTime, wboEntry, stopsAtWBO, callingStr } = enriched;
    const dest  = (svc.destination?.[0]?.locationName || 'Unknown').toUpperCase();
    const cls   = resolveClass(enriched);
    const st    = getStatus(svc, wboEntry);
    const exp   = expLabel(wboTime, wboEntry, svc);
    const badge = stopsAtWBO
      ? '<span class="stop-badge stops">● STOPS</span>'
      : '<span class="stop-badge passes">○ PASSES THROUGH</span>';

    // Key to detect when the displayed train actually changes
    const key = `${wboTime}|${dest}`;
    const trainChanged = _shown[elId] !== key;
    _shown[elId] = key;

    const html = `
<div class="row1${trainChanged ? ' panel-enter' : ''}">
  <span class="r1-time">${wboTime}</span>
  <span class="r1-dest">${dest}</span>
  <span class="r1-exp ${exp.cls}">${exp.text}</span>
</div>
${badge}
<div class="calling-wrap">
  <span class="calling-label">Calling at:</span>
  <div class="calling-ticker">
    <span class="calling-text">${callingStr || '—'}</span>
  </div>
</div>
<div class="row3">
  <span class="r3-class">${cls}</span>
  <span class="r3-status ${st.cls}">${st.text}</span>
</div>`;

    el.innerHTML = html;
  }

  // ── Fetch & refresh ────────────────────────────────────────────────
  async function refresh() {
    try {
      const [bdmData, ktrData] = await Promise.all([
        fetch(apiUrl(NORTH_STA.crs)).then(r => r.json()),
        fetch(apiUrl(SOUTH_STA.crs)).then(r => r.json())
      ]);

      const nowMins = toMins(new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }));

      // Northbound: trains leaving Bedford heading north through Wellingborough
      const northbound = (bdmData.trainServices || [])
        .filter(s => s.operatorCode === EMR_CODE && isNorthbound(s))
        .map(s => enrichWithWBO(s, NORTH_STA.crs, NORTH_STA.offsetMins))
        .filter(e => toMins(e.wboTime) >= nowMins)
        .sort((a, b) => toMins(a.wboTime) - toMins(b.wboTime));

      // Southbound: trains leaving Kettering heading south through Wellingborough
      const southbound = (ktrData.trainServices || [])
        .filter(s => s.operatorCode === EMR_CODE && isSouthbound(s))
        .map(s => enrichWithWBO(s, SOUTH_STA.crs, SOUTH_STA.offsetMins))
        .filter(e => toMins(e.wboTime) >= nowMins)
        .sort((a, b) => toMins(a.wboTime) - toMins(b.wboTime));

      // Store full lists so the display timer can re-filter without an API call
      cachedNorth = northbound;
      cachedSouth = southbound;

      updateDisplay();

    } catch (err) {
      const msg = `<div class="state">DATA ERROR — retrying in 30s</div>`;
      document.getElementById('north-body').innerHTML = msg;
      document.getElementById('south-body').innerHTML = msg;
      document.getElementById('footer').textContent =
        `Huxley2 error at ${new Date().toLocaleTimeString('en-GB')} — ${err.message}`;
      // Retry sooner after an error
      setTimeout(refresh, 30_000);
    }
  }

  // ── Re-filter cached data and repaint — no API call needed ───────────
  function updateDisplay() {
    const nowMins = toMins(new Date().toLocaleTimeString('en-GB',
      { hour: '2-digit', minute: '2-digit' }));

    const north = cachedNorth.filter(e => toMins(e.wboTime) >= nowMins);
    const south = cachedSouth.filter(e => toMins(e.wboTime) >= nowMins);

    renderPanel(north[0] || null, 'north-body');
    renderPanel(south[0] || null, 'south-body');

    requestAnimationFrame(() => requestAnimationFrame(initMarquees));

    document.getElementById('footer').textContent =
      `Updated ${new Date().toLocaleTimeString('en-GB')} · `
      + `${north.length} northbound, ${south.length} southbound · Auto-refresh 60s`;
  }

  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-GB');
  }

  setInterval(tick, 1000);
  setInterval(updateDisplay, DISPLAY_MS);   // re-filter every 15s, no API call
  tick();
  refresh();                                         // Huxley2 — runs immediately
  setInterval(refresh, REFRESH_MS);
  setTimeout(refreshRtt, 8000);                      // RTT — wait 8s so Huxley2 loads first
  setInterval(refreshRtt, RTT_REFRESH_MS);           // then every 10 min
</script>
</body>
</html>
