<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellingborough Line — Live Trains</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --y:    #FFE100;
      --ydim: #C09000;
      --bg:   #07070A;
      --div:  #2A2A2A;
      --grn:  #44EE44;
      --red:  #FF3030;
      --ora:  #FF9900;
    }

    body {
      background: var(--bg);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      padding: 14px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 3px,
        rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Header ──────────────────────────── */
    .page-hdr {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--ydim);
      padding-bottom: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .page-title { font-size: clamp(0.6rem, 2vw, 0.85rem); letter-spacing: 3px; color: var(--y); }
    .page-clock { font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: 5px; }

    /* ── Panels — always stacked vertically ─ */
    .panels {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }

    .display { border: 1px solid var(--ydim); padding: clamp(10px, 3vw, 20px); }

    .dir-bar {
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      letter-spacing: 3px;
      color: var(--y);
      border-bottom: 1px solid var(--div);
      padding-bottom: 7px;
      margin-bottom: 10px;
    }

    /* ── Main train row ───────────────────── */
    .row1 {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 5px;
      overflow: hidden;
    }
    .r1-time { font-size: clamp(1.6rem, 5vw, 2.4rem); letter-spacing: 2px; white-space: nowrap; flex-shrink: 0; }
    .r1-dest { font-size: clamp(1.1rem, 3.5vw, 1.8rem); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r1-exp  { font-size: clamp(0.75rem, 2vw, 1rem); white-space: nowrap; flex-shrink: 0; }
    .r1-exp.ontime { color: var(--grn); }
    .r1-exp.late   { color: var(--red); }
    .r1-exp.early  { color: var(--ora); }

    /* ── Stops vs passes badge ────────────── */
    .stop-badge {
      display: inline-block;
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      letter-spacing: 2px;
      padding: 2px 8px;
      border-radius: 2px;
      margin-bottom: 8px;
    }
    .stop-badge.stops   { background: var(--y); color: #000; }
    .train-class { display: inline-block; font-size: clamp(0.6rem, 1.8vw, 0.8rem); letter-spacing: 2px; padding: 2px 8px; border-radius: 2px; margin-bottom: 8px; margin-left: 6px; border: 1px solid var(--ydim); color: var(--ydim); }
    .stop-badge.passes  { border: 1px solid var(--ydim); color: var(--ydim); }

    /* ── Calling at (scrolling) ───────────── */
    .calling-wrap {
      display: flex;
      align-items: center;
      overflow: hidden;
      height: 1.4em;
      margin-bottom: 8px;
    }
    .calling-label {
      flex-shrink: 0;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      color: var(--ydim);
      margin-right: 6px;
    }
    .calling-ticker {
      flex: 1;
      overflow: hidden;
      position: relative;
      height: 100%;
    }
    .calling-text {
      position: absolute;
      top: 0;
      white-space: nowrap;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      line-height: 1.4em;
    }

    /* ── Class row ────────────────────────── */
    .row3 {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.65rem, 1.8vw, 0.85rem);
      flex-wrap: wrap;
      gap: 4px;
    }
    .r3-class  { color: var(--ydim); letter-spacing: 1px; }
    .r3-status { letter-spacing: 2px; }
    .r3-status.ontime    { color: var(--grn); }
    .r3-status.late      { color: var(--red); }
    .r3-status.cancelled { color: var(--red); text-decoration: line-through; }
    .r3-status.early     { color: var(--ora); }

    /* ── States ───────────────────────────── */
    .state { font-size: 0.72rem; letter-spacing: 3px; color: var(--ydim); padding: 14px 0; }

    /* ── Smooth panel transition ──────────── */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .panel-enter {
      animation: fade-in 0.35s ease forwards;
    }

    /* ── Louie thumbnail ─────────────────── */
    .louie-thumb {
      width: clamp(44px, 8vw, 64px);
      height: clamp(44px, 8vw, 64px);
      border-radius: 50%;
      border: 2px solid var(--ydim);
      object-fit: cover;
      flex-shrink: 0;
    }

    /* ── Footer ───────────────────────────── */
    .footer {
      margin-top: 12px;
      font-size: 0.58rem;
      color: var(--ydim);
      letter-spacing: 2px;
      text-align: center;
    }
  </style>
</head>

<script>
  // ── Strategy ───────────────────────────────────────────────────────
  // All data from Realtime Trains NG API (data.rtt.io). Three calls:
  //   WEL board  → which EMR trains STOP at Wellingborough (exact times)
  //   BDM board  → all northbound EMR departures from Bedford
  //   KET board  → all southbound EMR departures from Kettering
  // A BDM/KET train found in the WEL board (matched by service UID) STOPS.
  // One not found PASSES THROUGH (time estimated: BDM+11 / KET+6 min).
  // Calling points fetched from service-detail endpoint for displayed
  // trains only, cached so each service is only looked up once.

  const REFRESH_MS = 60_000;
  const DISPLAY_MS = 15_000;
  const EMR_CODE   = 'EM';
  const RTT_BASE    = 'https://summer-cloudwrtt-prozy-cee7.glwe.workers.dev';

  const NORTH_STA    = { crs: 'BDM', offsetMins: 11 };
  const SOUTH_STA    = { crs: 'KET', offsetMins:  6 };
  const HOUSE_OFFSET = 3;   // mins south of Wellingborough station

  let cachedNorth = [];
  let cachedSouth = [];
  const svcCache  = new Map();   // uid → service detail (calling points + class)


  // ── Helpers ────────────────────────────────────────────────────────
  function isoToHHMM(iso) {
    if (!iso) return null;
    const m = iso.match(/T(\d{2}):(\d{2})/);
    return m ? `${m[1]}:${m[2]}` : null;
  }

  function addMins(timeStr, mins) {
    try {
      const [h, m] = timeStr.split(':').map(Number);
      const t = h * 60 + m + mins;
      return `${String(Math.floor(t / 60) % 24).padStart(2,'0')}:${String(t % 60).padStart(2,'0')}`;
    } catch (_) { return timeStr; }
  }

  function toMins(timeStr) {
    try { const [h,m] = timeStr.split(':').map(Number); return h*60+m; }
    catch (_) { return 0; }
  }

  function nowHHMM() {
    return new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  }

  // ── Direction detection ────────────────────────────────────────────
  function isNorthbound(svc) {
    const dest = (svc.destination?.[0]?.location?.description || '').toLowerCase();
    return /leicester|nottingham|sheffield|derby|loughborough|kettering|corby|market harborough|chesterfield|leeds|york|lincoln|mansfield|worksop/.test(dest);
  }

  function isSouthbound(svc) {
    const dest = (svc.destination?.[0]?.location?.description || '').toLowerCase();
    return /london|pancras|bedford|luton|st albans|flitwick|harlington|leagrave/.test(dest);
  }

  // ── Calling points from service detail ────────────────────────────
  async function fetchDetail(uid) {
    if (svcCache.has(uid)) return svcCache.get(uid);
    try {
      // uid = "gb-nr:Y12192:2026-05-09" — split into identity + date
      const parts = uid.split(':');
      const identity = parts[1] || uid;
      const date     = parts[2] || new Date().toISOString().slice(0, 10);
      const res = await fetch(
        `${RTT_BASE}/gb-nr/service?identity=${encodeURIComponent(identity)}&departureDate=${date}&detailed=true`
      );
      if (!res.ok) return null;
      const data = await res.json();
      svcCache.set(uid, data);
      return data;
    } catch (_) { return null; }
  }

  // Extract calling points after Wellingborough (or nearest neighbour) from service detail.
  function callingAfterWEL(detail, fallbackCrs) {
    const locs = detail?.service?.locations || [];
    let idx = locs.findIndex(l => l.location?.shortCodes?.includes('WEL'));
    if (idx === -1 && fallbackCrs)
      idx = locs.findIndex(l => l.location?.shortCodes?.includes(fallbackCrs));
    if (idx === -1) return '';
    return locs
      .slice(idx + 1)
      .filter(l => {
        const d = l.temporalData?.displayAs;
        return d === 'CALL' || d === 'TERMINATES';
      })
      .map(l => l.location?.description)
      .filter(Boolean)
      .join('   ·   ');
  }

  // ── Extract train class from service detail ────────────────────────
  const BRANDING_CLASS = {
    'meridian': '222', 'aurora': '810', 'desiro': '360',
    'turbostar': '158', 'electrostar': '357'
  };

  // Quick class from location board entry (no service detail needed)
  function boardClass(svc) {
    const brand = (svc.locationMetadata?.stockBranding || '').toLowerCase();
    if (BRANDING_CLASS[brand]) return `Class ${BRANDING_CLASS[brand]}`;
    const n = svc.locationMetadata?.numberOfVehicles;
    if (n === 4 || n === 8) return 'Class 360';  // Corby corridor Desiros
    return '';
  }

  // Refined class from service detail
  function extractClass(detail) {
    const locs = detail?.service?.locations || [];
    for (const l of locs) {
      const brand = (l.locationMetadata?.stockBranding
                  || l.locationMetadata?.knowYourTrainData?.stockBranding
                  || '').toLowerCase();
      if (brand && BRANDING_CLASS[brand]) return `Class ${BRANDING_CLASS[brand]}`;
    }
    // numberOfVehicles heuristic (EMR Corby corridor = Class 360)
    const n = locs[0]?.locationMetadata?.numberOfVehicles;
    if (n === 4 || n === 8) return 'Class 360';
    return '';
  }

  // ── Enrich a BDM/KET service with WEL stop data ───────────────────
  function buildEnriched(svc, offsetMins, staCrs, welEntry, detail) {
    const uid        = svc.scheduleMetadata?.uniqueIdentity;
    const deptTime   = isoToHHMM(svc.temporalData?.departure?.scheduleAdvertised) || '??:??';
    const isCancelled = !!svc.temporalData?.departure?.isCancelled;
    const dest       = (svc.destination?.[0]?.location?.description || 'Unknown').toUpperCase();
    const stopsAtWBO = !!welEntry && welEntry.temporalData?.displayAs !== 'PASS';

    // WEL time: exact from WEL board if stopping, estimated if passing
    const wboTime = welEntry
      ? (isoToHHMM(welEntry.temporalData?.departure?.scheduleAdvertised)
         || isoToHHMM(welEntry.temporalData?.arrival?.scheduleAdvertised)
         || addMins(deptTime, offsetMins))
      : addMins(deptTime, offsetMins);

    // Live time at WEL
    const wboLive = welEntry
      ? (isoToHHMM(welEntry.temporalData?.departure?.realtimeForecast)
         || isoToHHMM(welEntry.temporalData?.arrival?.realtimeForecast))
      : null;

    // stationTime: used for filtering/sorting (actual WEL time)
    // wboTime: house-adjusted display time (3 mins south of station)
    const stationTime = wboTime;
    const houseTime = staCrs === NORTH_STA.crs
      ? addMins(wboTime, -HOUSE_OFFSET)
      : addMins(wboTime,  HOUSE_OFFSET);

    const callingStr  = detail ? callingAfterWEL(detail, staCrs) : '';
    const trainClass  = detail ? extractClass(detail) : boardClass(svc);

    return { uid, svc, welEntry, wboLive, stopsAtWBO, stationTime, wboTime: houseTime, callingStr, trainClass, dest, deptTime, isCancelled, offsetMins, staCrs };
  }

  // ── Status / timing labels ─────────────────────────────────────────
  function getStatus(e) {
    if (e.isCancelled) return { text: 'CANCELLED', cls: 'cancelled' };
    // Only check welEntry cancellation flags for trains that actually stop —
    // RTT may set departure.isCancelled=true for PASS events (meaning no stop, not cancelled)
    if (e.stopsAtWBO && e.welEntry) {
      if (e.welEntry.temporalData?.departure?.isCancelled ||
          e.welEntry.temporalData?.arrival?.isCancelled)
        return { text: 'CANCELLED', cls: 'cancelled' };
    }
    if (e.wboLive && e.wboLive !== e.wboTime)
      return { text: `Exp ${e.wboLive}`, cls: 'late' };
    if (e.welEntry) return { text: 'On time', cls: 'ontime' };
    // No WEL entry — check departure from BDM/KET for delay
    const live = isoToHHMM(e.svc.temporalData?.departure?.realtimeForecast
                         || e.svc.temporalData?.departure?.realtimeActual);
    if (live && live !== e.deptTime) return { text: 'Delayed', cls: 'late' };
    return { text: 'On time', cls: 'ontime' };
  }

  function expLabel(e) {
    if (e.isCancelled) return { text: 'Cancelled', cls: 'late' };
    if (e.welEntry) {
      if (e.wboLive && e.wboLive !== e.wboTime)
        return { text: `Exp ${e.wboLive}`, cls: 'late' };
      return { text: `Exp ${e.wboTime}`, cls: 'ontime' };
    }
    return { text: `~${e.wboTime} est`, cls: '' };
  }

  // ── Marquee ────────────────────────────────────────────────────────
  function startMarquee(ticker) {
    const text = ticker.querySelector('.calling-text');
    if (!text) return;
    text.getAnimations().forEach(a => a.cancel());
    text.style.left = '0px';
    setTimeout(() => {
      const tw = ticker.offsetWidth, iw = text.scrollWidth;
      if (!tw || !iw) return;
      text.animate(
        [{ left: `${tw}px` }, { left: `${-iw}px` }],
        { duration: ((tw + iw) / 80) * 1000, delay: 1200,
          iterations: Infinity, easing: 'linear', fill: 'backwards' }
      );
    }, 200);
  }

  function initMarquees() {
    document.querySelectorAll('.calling-ticker').forEach(startMarquee);
  }

  // ── Render ─────────────────────────────────────────────────────────
  const _shown = {};

  function renderPanel(e, elId) {
    const el = document.getElementById(elId);
    if (!e) {
      if (_shown[elId] !== 'none') {
        _shown[elId] = 'none';
        el.innerHTML = '<div class="state panel-enter">NO UPCOMING EMR SERVICE</div>';
      }
      return;
    }
    const st  = getStatus(e);
    const exp = expLabel(e);
    const badge = e.stopsAtWBO
      ? '<span class="stop-badge stops">● STOPS</span>'
      : '<span class="stop-badge passes">○ PASSES THROUGH</span>';
    const classTag = e.trainClass
      ? `<span class="train-class">${e.trainClass}</span>` : '';
    const key = `${e.wboTime}|${e.dest}`;
    const changed = _shown[elId] !== key;
    _shown[elId] = key;
    el.innerHTML = `
<div class="row1${changed ? ' panel-enter' : ''}">
  <span class="r1-time">${e.wboTime}</span>
  <span class="r1-dest">${e.dest}</span>
  <span class="r1-exp ${exp.cls}">${exp.text}</span>
</div>
${badge}${classTag}
<div class="calling-wrap">
  <span class="calling-label">Calling at:</span>
  <div class="calling-ticker">
    <span class="calling-text">${e.callingStr || '—'}</span>
  </div>
</div>
<div class="row3">
  <span class="r3-status ${st.cls}">${st.text}</span>
</div>`;
  }

  // ── Update display ─────────────────────────────────────────────────
  function updateDisplay() {
    const nowMins = toMins(nowHHMM());
    const north = cachedNorth.filter(e => toMins(e.stationTime) >= nowMins);
    const south = cachedSouth.filter(e => toMins(e.stationTime) >= nowMins);
    renderPanel(north[0] || null, 'north-body');
    renderPanel(south[0] || null, 'south-body');
    requestAnimationFrame(() => requestAnimationFrame(initMarquees));
    document.getElementById('footer').innerHTML =
      `Updated ${new Date().toLocaleTimeString('en-GB')} · `
      + `${north.length} northbound, ${south.length} southbound · Auto-refresh 60s`
      + ` · Data: <a href="https://realtimetrains.co.uk" target="_blank" style="color:var(--ydim);text-decoration:none;">Realtime Trains</a>`;
  }

  // Extract exact WEL scheduled/live time from service detail locations
  function welTimesFromDetail(detail) {
    const locs = detail?.service?.locations || [];
    const welLoc = locs.find(l => l.location?.shortCodes?.includes('WEL'));
    if (!welLoc) return null;
    const sched = isoToHHMM(welLoc.temporalData?.departure?.scheduleAdvertised
                          || welLoc.temporalData?.arrival?.scheduleAdvertised);
    const live  = isoToHHMM(welLoc.temporalData?.departure?.realtimeForecast
                          || welLoc.temporalData?.departure?.realtimeActual
                          || welLoc.temporalData?.arrival?.realtimeForecast
                          || welLoc.temporalData?.arrival?.realtimeActual);
    return sched ? { sched, live } : null;
  }

  // Fetch calling points for displayed trains and update panels
  async function enrichDisplayed() {
    const nowMins = toMins(nowHHMM());
    const toEnrich = [
      ...cachedNorth.filter(e => toMins(e.stationTime) >= nowMins - 5).slice(0, 2),
      ...cachedSouth.filter(e => toMins(e.stationTime) >= nowMins - 5).slice(0, 2),
    ];
    let updated = false;
    for (const e of toEnrich) {
      if (!e.uid || svcCache.has(e.uid)) continue;
      const detail = await fetchDetail(e.uid);
      if (!detail) continue;
      const calling    = callingAfterWEL(detail, e.staCrs);
      const trainClass = extractClass(detail);
      const welTimes   = welTimesFromDetail(detail);
      for (const list of [cachedNorth, cachedSouth]) {
        const idx = list.findIndex(x => x.uid === e.uid);
        if (idx === -1) continue;
        const entry = list[idx];
        let patch = { ...entry, callingStr: calling, trainClass };
        if (welTimes) {
          // Replace estimated time with exact WEL time from service detail
          const house = list === cachedNorth
            ? addMins(welTimes.sched, -HOUSE_OFFSET)
            : addMins(welTimes.sched,  HOUSE_OFFSET);
          patch = { ...patch, stationTime: welTimes.sched, wboTime: house,
                    wboLive: welTimes.live && welTimes.live !== welTimes.sched
                              ? (list === cachedNorth ? addMins(welTimes.live, -HOUSE_OFFSET)
                                                      : addMins(welTimes.live,  HOUSE_OFFSET))
                              : null };
        }
        list[idx] = patch;
        updated = true;
      }
    }
    if (updated) updateDisplay();
  }

  // ── Main refresh ───────────────────────────────────────────────────
  async function refresh() {
    try {
      const checkOk = tag => async r => {
        if (!r.ok) throw new Error(`${tag} ${r.status} ${r.statusText}`);
        return r.json();
      };

      const [welData, bdmData, ketData] = await Promise.all([
        fetch(`${RTT_BASE}/gb-nr/location?code=WEL&timeWindow=180`).then(checkOk('WEL')),
        fetch(`${RTT_BASE}/gb-nr/location?code=${NORTH_STA.crs}&timeWindow=180`).then(checkOk('BDM')),
        fetch(`${RTT_BASE}/gb-nr/location?code=${SOUTH_STA.crs}&timeWindow=180`).then(checkOk('KET')),
      ]);

      // Index ALL EMR services at WEL by UID — both CALL and PASS get exact times
      const welByUid = new Map();
      for (const s of (welData.services || [])) {
        const uid = s.scheduleMetadata?.uniqueIdentity;
        if (uid && s.scheduleMetadata?.operator?.code === EMR_CODE)
          welByUid.set(uid, s);
      }

      const nowMins = toMins(nowHHMM());

      // Bedford is the southern terminus — every EMR departure goes north UNLESS
      // the destination is itself southward (handles any terminating/arriving trains
      // that leak onto the departure board).
      function isNorthboundFromBDM(s) {
        const dest = (s.destination?.[0]?.location?.description || '').toLowerCase();
        if (!dest) return true;
        return !/(london|pancras|bedford|luton|flitwick|harlington|leagrave|st albans)/.test(dest);
      }

      cachedNorth = (bdmData.services || [])
        .filter(s => s.scheduleMetadata?.operator?.code === EMR_CODE && isNorthboundFromBDM(s))
        .map(s => buildEnriched(s, NORTH_STA.offsetMins, NORTH_STA.crs,
              welByUid.get(s.scheduleMetadata?.uniqueIdentity) || null,
              svcCache.get(s.scheduleMetadata?.uniqueIdentity) || null))
        .filter(e => toMins(e.stationTime) >= nowMins - 5)
        .sort((a, b) => toMins(a.stationTime) - toMins(b.stationTime));

      cachedSouth = (ketData.services || [])
        .filter(s => s.scheduleMetadata?.operator?.code === EMR_CODE && isSouthbound(s))
        .map(s => buildEnriched(s, SOUTH_STA.offsetMins, SOUTH_STA.crs,
              welByUid.get(s.scheduleMetadata?.uniqueIdentity) || null,
              svcCache.get(s.scheduleMetadata?.uniqueIdentity) || null))
        .filter(e => toMins(e.stationTime) >= nowMins - 5)
        .sort((a, b) => toMins(a.stationTime) - toMins(b.stationTime));

      updateDisplay();
      enrichDisplayed();   // fetch calling points in background

    } catch (err) {
      const msg = err.message || String(err);
      document.getElementById('north-body').innerHTML = `<div class="state">ERROR — ${msg}</div>`;
      document.getElementById('south-body').innerHTML = `<div class="state">ERROR — ${msg}</div>`;
      document.getElementById('footer').textContent =
        `RTT error at ${new Date().toLocaleTimeString('en-GB')} — ${msg}`;
      setTimeout(refresh, 30_000);
    }
  }

  function tick() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
  }

  setInterval(tick, 1000);
  setInterval(updateDisplay, DISPLAY_MS);
  tick();
  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
