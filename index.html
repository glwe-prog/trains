<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellingborough Line — Live Trains</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --y:    #FFE100;
      --ydim: #C09000;
      --bg:   #07070A;
      --div:  #2A2A2A;
      --grn:  #44EE44;
      --red:  #FF3030;
      --ora:  #FF9900;
    }

    body {
      background: var(--bg);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      padding: 14px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 3px,
        rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Header ──────────────────────────── */
    .page-hdr {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--ydim);
      padding-bottom: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .page-title { font-size: clamp(0.6rem, 2vw, 0.85rem); letter-spacing: 3px; color: var(--y); }
    .page-clock { font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: 5px; }

    /* ── Panels — always stacked vertically ─ */
    .panels {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto;
    }

    .display { border: 1px solid var(--ydim); padding: clamp(10px, 3vw, 20px); }

    .dir-bar {
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      letter-spacing: 3px;
      color: var(--y);
      border-bottom: 1px solid var(--div);
      padding-bottom: 7px;
      margin-bottom: 10px;
    }

    /* ── Main train row ───────────────────── */
    .row1 {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 5px;
      overflow: hidden;
    }
    .r1-time { font-size: clamp(1.6rem, 5vw, 2.4rem); letter-spacing: 2px; white-space: nowrap; flex-shrink: 0; }
    .r1-dest { font-size: clamp(1.1rem, 3.5vw, 1.8rem); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r1-exp  { font-size: clamp(0.75rem, 2vw, 1rem); white-space: nowrap; flex-shrink: 0; }
    .r1-exp.ontime { color: var(--grn); }
    .r1-exp.late   { color: var(--red); }
    .r1-exp.early  { color: var(--ora); }

    /* ── Stops vs passes badge ────────────── */
    .stop-badge {
      display: inline-block;
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      letter-spacing: 2px;
      padding: 2px 8px;
      border-radius: 2px;
      margin-bottom: 8px;
    }
    .stop-badge.stops   { background: var(--y); color: #000; }
    .stop-badge.passes  { border: 1px solid var(--ydim); color: var(--ydim); }

    /* ── Calling at (scrolling) ───────────── */
    .calling-wrap {
      display: flex;
      align-items: center;
      overflow: hidden;
      height: 1.4em;
      margin-bottom: 8px;
    }
    .calling-label {
      flex-shrink: 0;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      color: var(--ydim);
      margin-right: 6px;
    }
    .calling-ticker {
      flex: 1;
      overflow: hidden;
      position: relative;
      height: 100%;
    }
    .calling-text {
      position: absolute;
      top: 0;
      white-space: nowrap;
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      line-height: 1.4em;
    }

    /* ── Class row ────────────────────────── */
    .row3 {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.65rem, 1.8vw, 0.85rem);
      flex-wrap: wrap;
      gap: 4px;
    }
    .r3-class  { color: var(--ydim); letter-spacing: 1px; }
    .r3-status { letter-spacing: 2px; }
    .r3-status.ontime    { color: var(--grn); }
    .r3-status.late      { color: var(--red); }
    .r3-status.cancelled { color: var(--red); text-decoration: line-through; }
    .r3-status.early     { color: var(--ora); }

    /* ── States ───────────────────────────── */
    .state { font-size: 0.72rem; letter-spacing: 3px; color: var(--ydim); padding: 14px 0; }

    /* ── Smooth panel transition ──────────── */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .panel-enter {
      animation: fade-in 0.35s ease forwards;
    }

    /* ── Footer ───────────────────────────── */
    .footer {
      margin-top: 12px;
      font-size: 0.58rem;
      color: var(--ydim);
      letter-spacing: 2px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="page-hdr">
  <div class="page-title">EAST MIDLANDS RAILWAY &nbsp;·&nbsp; GREAT CENTRAL LINE &nbsp;·&nbsp; MIDLAND MAIN LINE &nbsp;·&nbsp; WELLINGBOROUGH LINE &nbsp;·&nbsp; LOUIE LINE</div>
  <div class="page-clock" id="clock">--:--:--</div>
</div>

<div class="panels">
  <div class="display">
    <div class="dir-bar">▲ &nbsp;NORTHBOUND &nbsp;·&nbsp; LEICESTER &nbsp;·&nbsp; NOTTINGHAM &nbsp;·&nbsp; SHEFFIELD</div>
    <div id="north-body"><div class="state">FETCHING…</div></div>
  </div>
  <div class="display">
    <div class="dir-bar">▼ &nbsp;SOUTHBOUND &nbsp;·&nbsp; LONDON ST PANCRAS</div>
    <div id="south-body"><div class="state">FETCHING…</div></div>
  </div>
</div>

<div class="footer" id="footer">—</div>

<script>
  // ── Strategy ───────────────────────────────────────────────────────
  // All data comes from the Realtime Trains NG API (data.rtt.io).
  // We query the neighbouring stations Bedford (northbound) and Kettering
  // (southbound) to see ALL trains passing Wellingborough, including
  // expresses that don't stop there.
  // To see ALL trains passing Wellingborough (including expresses that
  // don't stop), we query the neighbouring stations:
  //   NORTHBOUND — query Bedford (BDM): northbound departures that will
  //                pass through Wellingborough on their way north.
  //   SOUTHBOUND — query Kettering (KTR): southbound departures that will
  //                pass through Wellingborough on their way south.
  // For each train we check if Wellingborough is in its calling points
  // (it stops) or not (it passes through). Times are exact if stopping,
  // estimated if passing (BDM→WBO ≈ 11 min, KTR→WBO ≈ 6 min).

  const REFRESH_MS = 60_000;
  const DISPLAY_MS = 15_000;
  const EMR_CODE   = 'EM';
  const RTT_TOKEN  = '06d0b3b2-b937-4c50-b375-38fb18e201cb';
  const RTT_BASE   = 'https://data.rtt.io';

  // Neighbouring stations queried to capture all pass-through trains
  const NORTH_STA = { crs: 'BDM', offsetMins: 11 };  // Bedford  → WEL
  const SOUTH_STA = { crs: 'KET', offsetMins:  6 };  // Kettering → WEL

  let cachedNorth = [];
  let cachedSouth = [];

  // Service detail cache: uniqueIdentity → full RTT service response
  const svcCache = new Map();

  // ── Helpers ────────────────────────────────────────────────────────
  const rttHdr = () => ({ Authorization: `Bearer ${RTT_TOKEN}` });

  function isoToHHMM(iso) {
    if (!iso) return null;
    const m = iso.match(/T(\d{2}):(\d{2})/);
    return m ? `${m[1]}:${m[2]}` : null;
  }

  function addMins(timeStr, mins) {
    try {
      const [h, m] = timeStr.split(':').map(Number);
      const t = h * 60 + m + mins;
      return `${String(Math.floor(t / 60) % 24).padStart(2,'0')}:${String(t % 60).padStart(2,'0')}`;
    } catch (_) { return timeStr; }
  }

  function toMins(timeStr) {
    try { const [h,m] = timeStr.split(':').map(Number); return h*60+m; }
    catch (_) { return 0; }
  }

  function nowHHMM() {
    return new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  }

  // ── Direction detection ────────────────────────────────────────────
  function isNorthbound(svc) {
    const dest = (svc.destination?.[0]?.location?.description || '').toLowerCase();
    return /leicester|nottingham|sheffield|derby|loughborough|kettering|corby|market harborough|chesterfield/.test(dest);
  }

  function isSouthbound(svc) {
    const dest = (svc.destination?.[0]?.location?.description || '').toLowerCase();
    return /london|pancras|bedford|luton|st albans|flitwick|harlington|leagrave/.test(dest);
  }

  // ── Rolling stock ──────────────────────────────────────────────────
  function classToLabel(cls) {
    const c = (cls || '').toString().trim();
    if (c.startsWith('810')) return 'Class 810 Aurora';
    if (c.startsWith('222')) return 'Class 222 Meridian';
    if (c.startsWith('360')) return 'Class 360 Desiro';
    if (c.startsWith('158')) return 'Class 158 Express Sprinter';
    if (c.startsWith('180')) return 'Class 180 Adelante';
    if (c) return `Class ${c}`;
    return null;
  }

  function parseAllocationLabel(alloc) {
    if (!alloc) return null;
    const label = alloc.leadingClass ? classToLabel(alloc.leadingClass) : null;
    const units = (alloc.allocationItems || [])
      .map(u => (u.identity || '').toString().trim())
      .filter(Boolean)
      .map(id => id.replace(/^(\d{3})(\d+)$/, '$1 $2'));
    if (!label && !units.length) return null;
    if (label && units.length) return `${label} · ${units.join(' + ')}`;
    if (label) return label;
    const first = (alloc.allocationItems?.[0]?.identity || '').toString();
    return first ? classToLabel(first.substring(0, 3)) : null;
  }

  // Heuristic fallback when RTT has no allocation data
  function heuristicClass(svc, detail) {
    const dest  = (svc.destination?.[0]?.location?.description || '').toLowerCase();
    const orig  = (svc.origin?.[0]?.location?.description || '').toLowerCase();
    const stops = detail
      ? (detail.service?.locations || []).filter(l => {
          const d = l.temporalData?.displayAs;
          return d === 'CALL' || d === 'STARTS' || d === 'TERMINATES';
        }).length
      : 0;
    const is360 = dest.includes('corby') || orig.includes('corby')
      || (dest.includes('bedford') && stops >= 3)
      || (orig.includes('bedford') && stops >= 3
          && !dest.includes('pancras') && !dest.includes('nottingham')
          && !dest.includes('sheffield') && !dest.includes('derby'));
    if (is360) return 'Class 360 Desiro';
    return 'Class 810 or 222';
  }

  function resolveClass(svc, detail) {
    const label = parseAllocationLabel(detail?.service?.allocationData?.[0]);
    return label || heuristicClass(svc, detail);
  }

  // ── Status / timing labels ─────────────────────────────────────────
  function getStatus(enriched) {
    if (enriched.isCancelled) return { text: 'CANCELLED', cls: 'cancelled' };
    if (enriched.welLoc) {
      if (enriched.welLoc.temporalData?.departure?.isCancelled ||
          enriched.welLoc.temporalData?.arrival?.isCancelled)
        return { text: 'CANCELLED', cls: 'cancelled' };
      const sched = isoToHHMM(enriched.welLoc.temporalData?.departure?.scheduleAdvertised)
                 || isoToHHMM(enriched.welLoc.temporalData?.arrival?.scheduleAdvertised);
      const live  = isoToHHMM(enriched.welLoc.temporalData?.departure?.realtimeForecast)
                 || isoToHHMM(enriched.welLoc.temporalData?.arrival?.realtimeForecast);
      if (live && sched && live !== sched) return { text: `Exp ${live}`, cls: 'late' };
      return { text: 'On time', cls: 'ontime' };
    }
    const sched = isoToHHMM(enriched.svc.temporalData?.departure?.scheduleAdvertised);
    const live  = isoToHHMM(enriched.svc.temporalData?.departure?.realtimeForecast
                          || enriched.svc.temporalData?.departure?.realtimeActual);
    if (live && sched && live !== sched) return { text: 'Delayed', cls: 'late' };
    return { text: 'On time', cls: 'ontime' };
  }

  function expLabel(enriched) {
    if (enriched.isCancelled) return { text: 'Cancelled', cls: 'late' };
    if (enriched.welLoc) {
      const sched = isoToHHMM(enriched.welLoc.temporalData?.departure?.scheduleAdvertised)
                 || isoToHHMM(enriched.welLoc.temporalData?.arrival?.scheduleAdvertised);
      const live  = isoToHHMM(enriched.welLoc.temporalData?.departure?.realtimeForecast)
                 || isoToHHMM(enriched.welLoc.temporalData?.arrival?.realtimeForecast);
      if (live && sched && live !== sched) return { text: `Exp ${live}`, cls: 'late' };
      return { text: `Exp ${enriched.wboTime}`, cls: 'ontime' };
    }
    return { text: `~${enriched.wboTime} est`, cls: '' };
  }

  // ── Build enriched record ──────────────────────────────────────────
  // Combines a location-lineup entry with its service detail (if cached).
  function buildEnriched(svc, crs, offsetMins, detail) {
    const uid        = svc.scheduleMetadata?.uniqueIdentity;
    const deptTime   = isoToHHMM(svc.temporalData?.departure?.scheduleAdvertised) || '??:??';
    const isCancelled = !!svc.temporalData?.departure?.isCancelled;
    const dest       = (svc.destination?.[0]?.location?.description || 'Unknown').toUpperCase();

    let wboTime, welLoc, stopsAtWBO, callingStr;

    if (detail) {
      const locs = detail.service?.locations || [];
      welLoc = locs.find(l =>
        l.location?.shortCodes?.includes('WEL') &&
        l.temporalData?.displayAs !== 'PASS'
      );
      wboTime = welLoc
        ? (isoToHHMM(welLoc.temporalData?.departure?.scheduleAdvertised)
           || isoToHHMM(welLoc.temporalData?.arrival?.scheduleAdvertised)
           || addMins(deptTime, offsetMins))
        : addMins(deptTime, offsetMins);
      stopsAtWBO = !!welLoc;
      callingStr = locs
        .filter(l => l.temporalData?.displayAs === 'CALL'
                  || l.temporalData?.displayAs === 'TERMINATES')
        .map(l => l.location?.description)
        .filter(Boolean)
        .join('   ·   ');
    } else {
      wboTime    = addMins(deptTime, offsetMins);
      welLoc     = null;
      stopsAtWBO = false;
      callingStr = '';
    }

    const classLabel = resolveClass(svc, detail);

    return { uid, svc, detail, crs, offsetMins, wboTime, welLoc,
             stopsAtWBO, callingStr, classLabel, dest, deptTime, isCancelled };
  }

  // ── Service detail fetch ───────────────────────────────────────────
  async function fetchDetail(uid) {
    try {
      const res = await fetch(
        `${RTT_BASE}/gb-nr/service?uniqueIdentity=${encodeURIComponent(uid)}`,
        { headers: rttHdr() }
      );
      if (!res.ok) return null;
      return await res.json();
    } catch (_) { return null; }
  }

  // Fetch service detail for all services not already cached.
  // Sequential with a short gap to stay within RTT's 30 req/min limit.
  async function fetchMissingDetails(svcs) {
    for (const svc of svcs) {
      const uid = svc.scheduleMetadata?.uniqueIdentity;
      if (!uid || svcCache.has(uid)) continue;
      const detail = await fetchDetail(uid);
      if (detail) {
        svcCache.set(uid, detail);
        // Update any matching enriched records in the display cache
        for (const list of [cachedNorth, cachedSouth]) {
          for (let i = 0; i < list.length; i++) {
            if (list[i].uid === uid) {
              const { svc: s, crs, offsetMins } = list[i];
              list[i] = buildEnriched(s, crs, offsetMins, detail);
            }
          }
        }
        updateDisplay();
      }
      await new Promise(r => setTimeout(r, 250));
    }
  }

  // ── Marquee animation ──────────────────────────────────────────────
  function startMarquee(ticker) {
    const text = ticker.querySelector('.calling-text');
    if (!text) return;

    // Cancel any previous animation on this element
    text.getAnimations().forEach(a => a.cancel());
    text.style.left = '0px';

    // Short delay so layout + fonts are settled
    setTimeout(() => {
      const tw = ticker.offsetWidth;
      const iw = text.scrollWidth;
      if (!tw || !iw) return;

      const durMs = ((tw + iw) / 80) * 1000;   // 80px/s

      text.animate(
        [{ left: `${tw}px` }, { left: `${-iw}px` }],
        { duration: durMs, delay: 1200, iterations: Infinity,
          easing: 'linear', fill: 'backwards' }
      );
    }, 200);
  }

  function initMarquees() {
    document.querySelectorAll('.calling-ticker').forEach(startMarquee);
  }

  // ── Render ─────────────────────────────────────────────────────────
  const _shown = {};

  function renderPanel(enriched, elId) {
    const el = document.getElementById(elId);

    if (!enriched) {
      if (_shown[elId] !== 'none') {
        _shown[elId] = 'none';
        el.innerHTML = '<div class="state panel-enter">NO UPCOMING EMR SERVICE</div>';
      }
      return;
    }

    const { wboTime, stopsAtWBO, callingStr, classLabel, dest, detail, isCancelled } = enriched;
    const st  = getStatus(enriched);
    const exp = expLabel(enriched);

    // Show "· · ·" while service detail is still loading
    const badge = detail === null
      ? '<span class="stop-badge passes">· · ·</span>'
      : stopsAtWBO
        ? '<span class="stop-badge stops">● STOPS</span>'
        : '<span class="stop-badge passes">○ PASSES THROUGH</span>';

    const key = `${wboTime}|${dest}`;
    const trainChanged = _shown[elId] !== key;
    _shown[elId] = key;

    el.innerHTML = `
<div class="row1${trainChanged ? ' panel-enter' : ''}">
  <span class="r1-time">${wboTime}</span>
  <span class="r1-dest">${dest}</span>
  <span class="r1-exp ${exp.cls}">${exp.text}</span>
</div>
${badge}
<div class="calling-wrap">
  <span class="calling-label">Calling at:</span>
  <div class="calling-ticker">
    <span class="calling-text">${callingStr || '—'}</span>
  </div>
</div>
<div class="row3">
  <span class="r3-class">${classLabel}</span>
  <span class="r3-status ${st.cls}">${st.text}</span>
</div>`;
  }

  // ── Update display from cache ──────────────────────────────────────
  function updateDisplay() {
    const nowMins = toMins(nowHHMM());
    const north = cachedNorth.filter(e => toMins(e.wboTime) >= nowMins);
    const south = cachedSouth.filter(e => toMins(e.wboTime) >= nowMins);

    renderPanel(north[0] || null, 'north-body');
    renderPanel(south[0] || null, 'south-body');

    requestAnimationFrame(() => requestAnimationFrame(initMarquees));

    document.getElementById('footer').textContent =
      `Updated ${new Date().toLocaleTimeString('en-GB')} · `
      + `${north.length} northbound, ${south.length} southbound · Auto-refresh 60s`;
  }

  // ── Main refresh ───────────────────────────────────────────────────
  async function refresh() {
    try {
      const [bdmData, ketData] = await Promise.all([
        fetch(`${RTT_BASE}/gb-nr/location?code=${NORTH_STA.crs}&timeWindow=120`, { headers: rttHdr() }).then(r => r.json()),
        fetch(`${RTT_BASE}/gb-nr/location?code=${SOUTH_STA.crs}&timeWindow=120`, { headers: rttHdr() }).then(r => r.json()),
      ]);

      const nowMins = toMins(nowHHMM());

      const northSvcs = (bdmData.services || [])
        .filter(s => s.scheduleMetadata?.operator?.code === EMR_CODE && isNorthbound(s));
      const southSvcs = (ketData.services || [])
        .filter(s => s.scheduleMetadata?.operator?.code === EMR_CODE && isSouthbound(s));

      // Build enriched records — use cached service detail where available
      cachedNorth = northSvcs
        .map(s => buildEnriched(s, NORTH_STA.crs, NORTH_STA.offsetMins,
                                svcCache.get(s.scheduleMetadata?.uniqueIdentity) ?? null))
        .filter(e => toMins(e.wboTime) >= nowMins)
        .sort((a, b) => toMins(a.wboTime) - toMins(b.wboTime));

      cachedSouth = southSvcs
        .map(s => buildEnriched(s, SOUTH_STA.crs, SOUTH_STA.offsetMins,
                                svcCache.get(s.scheduleMetadata?.uniqueIdentity) ?? null))
        .filter(e => toMins(e.wboTime) >= nowMins)
        .sort((a, b) => toMins(a.wboTime) - toMins(b.wboTime));

      updateDisplay();

      // Background: fetch service detail for any not yet cached
      fetchMissingDetails([...northSvcs, ...southSvcs]);

    } catch (err) {
      document.getElementById('north-body').innerHTML = '<div class="state">DATA ERROR — retrying in 30s</div>';
      document.getElementById('south-body').innerHTML = '<div class="state">DATA ERROR — retrying in 30s</div>';
      document.getElementById('footer').textContent =
        `RTT error at ${new Date().toLocaleTimeString('en-GB')} — ${err.message}`;
      setTimeout(refresh, 30_000);
    }
  }

  function tick() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
  }

  setInterval(tick, 1000);
  setInterval(updateDisplay, DISPLAY_MS);
  tick();
  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
