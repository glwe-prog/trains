<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Year in Service Quiz — Wellingborough Line</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --y:    #FFE100;
      --ydim: #C09000;
      --bg:   #07070A;
      --div:  #2A2A2A;
      --grn:  #44EE44;
      --red:  #FF3030;
      --ora:  #FF9900;
    }
    body {
      background: var(--bg);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom,
        transparent 0, transparent 3px,
        rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
      pointer-events: none;
      z-index: 9999;
    }
    .page-hdr {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--ydim);
      padding-bottom: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .page-title { font-size: clamp(0.55rem, 2vw, 0.82rem); letter-spacing: 3px; }
    .page-clock  { font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: 5px; }
    .container   { max-width: 700px; margin: 0 auto; }

    #quiz-panel { border: 1px solid var(--ydim); padding: clamp(12px, 4vw, 22px); }

    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: var(--ydim);
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .dots { display: flex; gap: 5px; }
    .dot  { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--ydim); }
    .dot.current { background: var(--y); border-color: var(--y); box-shadow: 0 0 5px var(--y); }
    .dot.correct { background: var(--grn); border-color: var(--grn); }
    .dot.wrong   { background: var(--red); border-color: var(--red); }

    .img-wrap {
      width: 100%;
      height: clamp(180px, 40vw, 300px);
      border: 1px solid var(--div);
      margin-bottom: 14px;
      overflow: hidden;
      background: #111;
      position: relative;
    }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .no-img {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--ydim); font-size: 0.75rem; letter-spacing: 2px;
    }

    .question { font-size: clamp(0.8rem, 2.5vw, 1rem); letter-spacing: 2px; margin-bottom: 14px; }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 460px) { .choices { grid-template-columns: 1fr; } }

    .choice-btn {
      background: transparent;
      border: 1px solid var(--ydim);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: clamp(0.8rem, 2.5vw, 1.2rem);
      letter-spacing: 3px;
      padding: 12px 12px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.12s, background 0.12s;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--y); background: rgba(255,225,0,0.07); }
    .choice-btn.correct { border-color: var(--grn) !important; background: rgba(68,238,68,0.12) !important; color: var(--grn) !important; }
    .choice-btn.wrong   { border-color: var(--red) !important; background: rgba(255,48,48,0.10) !important; color: var(--red) !important; }
    .choice-btn:disabled { cursor: default; }

    #feedback { min-height: 1.5em; font-size: 0.82rem; letter-spacing: 2px; margin-bottom: 10px; }
    .fb-ok  { color: var(--grn); }
    .fb-err { color: var(--red); }

    #next-btn {
      background: transparent;
      border: 1px solid var(--y);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.82rem;
      letter-spacing: 3px;
      padding: 9px 22px;
      cursor: pointer;
      display: none;
    }
    #next-btn:hover { background: rgba(255,225,0,0.10); }

    #results {
      border: 1px solid var(--ydim);
      padding: clamp(20px, 6vw, 44px);
      text-align: center;
      display: none;
    }
    .res-score { font-size: clamp(3rem, 10vw, 5rem); letter-spacing: 6px; margin-bottom: 10px; }
    .res-msg   { font-size: clamp(0.85rem, 2.5vw, 1.1rem); letter-spacing: 2px; margin-bottom: 8px; }
    .res-sub   { font-size: 0.7rem; letter-spacing: 2px; color: var(--ydim); margin-bottom: 26px; line-height: 1.8; }
    .play-again {
      background: transparent;
      border: 1px solid var(--y);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.88rem;
      letter-spacing: 3px;
      padding: 11px 28px;
      cursor: pointer;
    }
    .play-again:hover { background: rgba(255,225,0,0.10); }

    .back-links {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .back-link {
      font-size: 0.63rem;
      letter-spacing: 2px;
      color: var(--ydim);
      text-decoration: none;
    }
    .back-link:hover { color: var(--y); }

    /* ── Birthday / confetti overlay ──────────────────────────────────────── */
    #bday-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10000;
      display: none;
    }
    #bday-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #07070A;
      border: 3px solid var(--y);
      padding: 24px 40px;
      text-align: center;
      z-index: 10001;
      display: none;
      animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop-in {
      from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      to   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    }
    .bday-emoji  { font-size: 3rem; display: block; margin-bottom: 8px; }
    .bday-title  { font-size: clamp(1rem, 4vw, 1.6rem); letter-spacing: 4px; color: var(--y); }
    .bday-sub    { font-size: 0.7rem; letter-spacing: 2px; color: var(--ydim); margin-top: 8px; line-height: 1.7; }
  </style>
</head>
<body>

<canvas id="bday-canvas"></canvas>
<div id="bday-banner">
  <span class="bday-emoji">🎂</span>
  <div class="bday-title" id="bday-title">HAPPY BIRTHDAY!</div>
  <div class="bday-sub"   id="bday-sub"></div>
</div>

<div class="page-hdr">
  <div class="page-title">WELLINGBOROUGH LINE &nbsp;·&nbsp; YEAR IN SERVICE &nbsp;·&nbsp; LOUIE LINE</div>
  <div class="page-clock" id="clock">--:--:--</div>
</div>

<div class="container">

  <div id="quiz-panel">
    <div class="progress">
      <span id="q-label">QUESTION 1 OF 10</span>
      <div class="dots" id="dots"></div>
      <span id="q-score">SCORE: 0/0</span>
    </div>
    <div class="img-wrap" id="img-wrap"></div>
    <div class="question" id="q-text">WHAT YEAR DID THIS CLASS FIRST ENTER SERVICE?</div>
    <div class="choices" id="choices"></div>
    <div id="feedback"></div>
    <button id="next-btn" onclick="nextQuestion()">NEXT →</button>
  </div>

  <div id="results">
    <div class="res-score" id="res-score"></div>
    <div class="res-msg"   id="res-msg"></div>
    <div class="res-sub"   id="res-sub"></div>
    <button class="play-again" onclick="resetQuiz()">▶ PLAY AGAIN</button>
  </div>

  <div class="back-links">
    <a href="quizzes.html" class="back-link">◄ QUIZ MENU</a>
    <a href="index.html"   class="back-link">LIVE TRAIN BOARD ►</a>
  </div>

</div>

<script>
// ── Catalogue — class slug, display name, year in service, optional day/month ──
// day/month used for birthday check (1-indexed). Omit if only year is known.
const CATALOGUE = [
  { slug: 'class_37',    name: 'Class 37',              year: 1960, month: 12, day: 2  },
  { slug: 'class_43_hst',name: 'Class 43 HST (IC125)', year: 1976 },
  { slug: 'class_47',    name: 'Class 47',              year: 1962 },
  { slug: 'class_57',    name: 'Class 57',              year: 1999 },
  { slug: 'class_66',    name: 'Class 66',              year: 1998 },
  { slug: 'class_67',    name: 'Class 67',              year: 1999 },
  { slug: 'class_68',    name: 'Class 68',              year: 2014 },
  { slug: 'class_91',    name: 'Class 91 (IC225)',      year: 1989, month: 3,  day: 3  },
  { slug: 'class_153',   name: 'Class 153',             year: 1991 },
  { slug: 'class_155',   name: 'Class 155 Super Sprinter', year: 1988 },
  { slug: 'class_156',   name: 'Class 156 Super Sprinter', year: 1988 },
  { slug: 'class_158',   name: 'Class 158 Express Sprinter', year: 1990 },
  { slug: 'class_159',   name: 'Class 159',             year: 1993 },
  { slug: 'class_170',   name: 'Class 170 Turbostar',   year: 1999 },
  { slug: 'class_171',   name: 'Class 171 Turbostar',   year: 2003 },
  { slug: 'class_175',   name: 'Class 175 Coradia',     year: 2000, month: 6,  day: 20 },
  { slug: 'class_180',   name: 'Class 180 Adelante',    year: 2001 },
  { slug: 'class_185',   name: 'Class 185 Desiro',      year: 2006 },
  { slug: 'class_195',   name: 'Class 195 Civity',      year: 2019, month: 7,  day: 1  },
  { slug: 'class_197',   name: 'Class 197 Civity',      year: 2022, month: 11, day: 14 },
  { slug: 'class_220',   name: 'Class 220 Voyager',     year: 2001, month: 5,  day: 21 },
  { slug: 'class_221',   name: 'Class 221 Super Voyager', year: 2002, month: 4, day: 12 },
  { slug: 'class_222',   name: 'Class 222 Meridian',    year: 2004, month: 5,  day: 31 },
  { slug: 'class_313',   name: 'Class 313',             year: 1976 },
  { slug: 'class_315',   name: 'Class 315',             year: 1980 },
  { slug: 'class_317',   name: 'Class 317',             year: 1983, month: 3,  day: 28 },
  { slug: 'class_319',   name: 'Class 319',             year: 1988 },
  { slug: 'class_321',   name: 'Class 321',             year: 1988 },
  { slug: 'class_323',   name: 'Class 323',             year: 1994, month: 2,  day: 7  },
  { slug: 'class_331',   name: 'Class 331 Civity',      year: 2019, month: 7,  day: 1  },
  { slug: 'class_333',   name: 'Class 333',             year: 2001, month: 1,  day: 12 },
  { slug: 'class_334',   name: 'Class 334',             year: 2001 },
  { slug: 'class_350',   name: 'Class 350 Desiro',      year: 2005 },
  { slug: 'class_357',   name: 'Class 357',             year: 2000 },
  { slug: 'class_360',   name: 'Class 360 Desiro',      year: 2003 },
  { slug: 'class_365',   name: 'Class 365 Networker',   year: 1996, month: 10, day: 13 },
  { slug: 'class_375',   name: 'Class 375 Electrostar', year: 2000 },
  { slug: 'class_377',   name: 'Class 377 Electrostar', year: 2003 },
  { slug: 'class_380',   name: 'Class 380 Desiro',      year: 2010 },
  { slug: 'class_385',   name: 'Class 385 AT200',       year: 2018, month: 7,  day: 24 },
  { slug: 'class_387',   name: 'Class 387 Electrostar', year: 2014 },
  { slug: 'class_390',   name: 'Class 390 Pendolino',   year: 2002, month: 7,  day: 23 },
  { slug: 'class_395',   name: 'Class 395 Javelin',     year: 2009, month: 6,  day: 29 },
  { slug: 'class_444',   name: 'Class 444 Desiro',      year: 2004 },
  { slug: 'class_450',   name: 'Class 450 Desiro',      year: 2003, month: 10, day: 5  },
  { slug: 'class_455',   name: 'Class 455',             year: 1983, month: 3,  day: 28 },
  { slug: 'class_465',   name: 'Class 465 Networker',   year: 1992, month: 12, day: 1  },
  { slug: 'class_700',   name: 'Class 700 Desiro City', year: 2016, month: 6,  day: 20 },
  { slug: 'class_707',   name: 'Class 707 Desiro City', year: 2017, month: 8,  day: 17 },
  { slug: 'class_710',   name: 'Class 710 Aventra',     year: 2019, month: 5,  day: 23 },
  { slug: 'class_720',   name: 'Class 720 Aventra',     year: 2020, month: 11, day: 26 },
  { slug: 'class_745',   name: 'Class 745',             year: 2020, month: 1,  day: 8  },
  { slug: 'class_755',   name: 'Class 755 FLIRT',       year: 2019, month: 7,  day: 29 },
  { slug: 'class_800',   name: 'Class 800 Azuma',       year: 2019, month: 5,  day: 15 },
  { slug: 'class_802',   name: 'Class 802',             year: 2018, month: 8,  day: 19 },
  { slug: 'class_810',   name: 'Class 810 Aurora',      year: 2025, month: 12, day: 3  },
];

const QUIZ_SIZE = 10;

let questions = [];
let current   = 0;
let score     = 0;
let answered  = false;
let dotStates = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Generate plausible wrong year choices within the fleet's era
function wrongYears(correct) {
  const allYears = CATALOGUE.map(c => c.year);
  const minY = 1960, maxY = 2025;
  const pool = new Set();

  // Prefer years close to the correct answer (tricky distractors)
  const offsets = shuffle([-2,-3,-4,-5,2,3,4,5,-8,-10,8,10,-15,15]);
  for (const off of offsets) {
    const y = correct + off;
    if (y !== correct && y >= minY && y <= maxY) pool.add(y);
    if (pool.size >= 6) break;
  }
  // Backfill from real class years if needed
  for (const y of shuffle([...new Set(allYears)])) {
    if (y !== correct) pool.add(y);
    if (pool.size >= 6) break;
  }
  return shuffle([...pool]).slice(0, 3);
}

function buildQuiz() {
  const picks = shuffle(CATALOGUE).slice(0, QUIZ_SIZE);
  questions = picks.map(train => {
    const ws = wrongYears(train.year);
    return {
      train,
      choices: shuffle([train.year, ...ws])
    };
  });
  dotStates = Array(QUIZ_SIZE).fill('pending');
  current   = 0;
  score     = 0;
  answered  = false;
  document.getElementById('results').style.display    = 'none';
  document.getElementById('quiz-panel').style.display = 'block';
  showQuestion();
}

function renderDots() {
  document.getElementById('dots').innerHTML =
    dotStates.map((s,i) => {
      const cls = i===current ? 'dot current'
                : s==='correct' ? 'dot correct'
                : s==='wrong'   ? 'dot wrong' : 'dot';
      return `<div class="${cls}"></div>`;
    }).join('');
}

function showQuestion() {
  answered = false;
  const q  = questions[current];

  document.getElementById('q-label').textContent  = `QUESTION ${current+1} OF ${QUIZ_SIZE}`;
  document.getElementById('q-score').textContent  = `SCORE: ${score}/${current}`;
  document.getElementById('q-text').textContent   = `WHAT YEAR DID THE ${q.train.name.toUpperCase()} FIRST ENTER SERVICE?`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className   = '';
  document.getElementById('next-btn').style.display = 'none';
  renderDots();

  const wrap = document.getElementById('img-wrap');
  wrap.innerHTML = '';
  const img  = document.createElement('img');
  img.src    = `images/${q.train.slug}.jpg`;
  img.alt    = q.train.name;
  img.onerror = () => { wrap.innerHTML = '<div class="no-img">NO PHOTO AVAILABLE</div>'; };
  wrap.appendChild(img);

  document.getElementById('choices').innerHTML =
    q.choices.map(c =>
      `<button class="choice-btn" data-choice="${c}" onclick="handleAnswer(this)">${c}</button>`
    ).join('');

  // Birthday check
  checkBirthday(q.train);
}

function checkBirthday(train) {
  if (!train.month || !train.day) return;
  const now = new Date();
  if (now.getMonth()+1 === train.month && now.getDate() === train.day) {
    triggerBirthday(train);
  }
}

function handleAnswer(btn) {
  if (answered) return;
  answered = true;

  const chosen  = parseInt(btn.dataset.choice, 10);
  const correct = questions[current].train.year;
  const fb      = document.getElementById('feedback');

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (parseInt(b.dataset.choice,10) === correct) b.classList.add('correct');
  });

  if (chosen === correct) {
    score++;
    dotStates[current] = 'correct';
    fb.textContent = '✓  CORRECT!';
    fb.className   = 'fb-ok';
  } else {
    btn.classList.add('wrong');
    dotStates[current] = 'wrong';
    fb.textContent = `✗  WRONG — It was ${correct}`;
    fb.className   = 'fb-err';
  }

  renderDots();
  const nb = document.getElementById('next-btn');
  nb.textContent   = current+1 < QUIZ_SIZE ? 'NEXT QUESTION →' : 'SEE RESULTS →';
  nb.style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current >= QUIZ_SIZE) { showResults(); return; }
  showQuestion();
}

function showResults() {
  document.getElementById('quiz-panel').style.display = 'none';
  document.getElementById('results').style.display    = 'block';

  const pct = score / QUIZ_SIZE;
  let msg, colour;
  if (pct === 1)       { msg = '★  PERFECT — History master!';                colour = 'var(--grn)'; }
  else if (pct >= 0.8) { msg = 'EXCELLENT — You know your fleet history!';     colour = 'var(--grn)'; }
  else if (pct >= 0.6) { msg = 'GOOD EFFORT — Keep reading those timetables!'; colour = 'var(--y)';   }
  else if (pct >= 0.4) { msg = 'NOT BAD — More research needed!';              colour = 'var(--ora)'; }
  else                 { msg = 'KEEP PRACTISING — Study the fleet!';           colour = 'var(--red)'; }

  document.getElementById('res-score').textContent = `${score}/${QUIZ_SIZE}`;
  document.getElementById('res-score').style.color = colour;
  document.getElementById('res-msg').textContent   = msg;
  document.getElementById('res-sub').innerHTML     =
    `${score} correct out of ${QUIZ_SIZE} questions<br>`
    + `Drawn from ${CATALOGUE.length} classes, 1960–2025`;
}

function resetQuiz() { buildQuiz(); }

// ── Birthday / confetti ───────────────────────────────────────────────────────
let confettiAnim = null;

function triggerBirthday(train) {
  const age = new Date().getFullYear() - train.year;
  const banner = document.getElementById('bday-banner');
  document.getElementById('bday-title').textContent =
    `HAPPY ${age}th BIRTHDAY!`;
  document.getElementById('bday-sub').innerHTML =
    `The <strong>${train.name}</strong> first entered service today<br>`
    + `on ${String(train.day).padStart(2,'0')}/${String(train.month).padStart(2,'0')}/${train.year}`;
  banner.style.display = 'block';
  setTimeout(() => { banner.style.display = 'none'; }, 6000);
  launchConfetti();
}

function launchConfetti() {
  const canvas = document.getElementById('bday-canvas');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');

  const COLORS = ['#FFE100','#44EE44','#FF3030','#FF9900','#00CFFF','#FF66CC'];
  const pieces = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: -20,
    r: 4 + Math.random() * 6,
    col: COLORS[Math.floor(Math.random()*COLORS.length)],
    vx: (Math.random()-0.5) * 4,
    vy: 2 + Math.random() * 4,
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random()-0.5) * 0.2
  }));

  if (confettiAnim) cancelAnimationFrame(confettiAnim);

  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = 0;
    for (const p of pieces) {
      p.x += p.vx; p.y += p.vy; p.angle += p.spin; p.vy += 0.05;
      if (p.y < canvas.height + 20) alive++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.8);
      ctx.restore();
    }
    if (alive > 0) { confettiAnim = requestAnimationFrame(frame); }
    else { canvas.style.display = 'none'; }
  }
  confettiAnim = requestAnimationFrame(frame);
}

// ── Konami Code test trigger ─────────────────────────────────────────────────
// ↑↑↓↓←→←→BA — press this to test the birthday effect
const KONAMI = [38,38,40,40,37,39,37,39,66,65];
let konamiPos = 0;
document.addEventListener('keydown', e => {
  if (e.keyCode === KONAMI[konamiPos]) {
    konamiPos++;
    if (konamiPos === KONAMI.length) {
      konamiPos = 0;
      // Find a class with a known day/month to demo
      const demo = CATALOGUE.find(c => c.month && c.day) || CATALOGUE[0];
      // Override with today's date for demo
      const now = new Date();
      const fakeTrain = { ...demo, month: now.getMonth()+1, day: now.getDate() };
      triggerBirthday(fakeTrain);
    }
  } else {
    konamiPos = e.keyCode === KONAMI[0] ? 1 : 0;
  }
});

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
}
setInterval(tick, 1000);
tick();

buildQuiz();
</script>
</body>
</html>
