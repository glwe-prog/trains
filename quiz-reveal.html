<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reveal the Livery — Wellingborough Line</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --y:    #FFE100;
      --ydim: #C09000;
      --bg:   #07070A;
      --div:  #2A2A2A;
      --grn:  #44EE44;
      --red:  #FF3030;
      --ora:  #FF9900;
    }
    body {
      background: var(--bg);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      padding: 14px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(to bottom,
        transparent 0, transparent 3px,
        rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
      pointer-events: none;
      z-index: 9999;
    }
    .page-hdr {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--ydim);
      padding-bottom: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .page-title { font-size: clamp(0.55rem, 2vw, 0.82rem); letter-spacing: 3px; }
    .page-clock  { font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: 5px; }
    .container   { max-width: 700px; margin: 0 auto; }

    /* ── Image + grid overlay ── */
    .img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border: 1px solid var(--div);
      overflow: hidden;
      background: #111;
      margin-bottom: 0;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    #grid-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows:    repeat(3, 1fr);
      pointer-events: none;
    }
    .g-cell {
      background: var(--bg);
      transition: opacity 0.35s ease;
    }
    /* Permanent grid lines drawn on top — unaffected by cell opacity */
    #grid-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 1px solid #444;
      background:
        linear-gradient(to right,  #444 1px, transparent 1px) 0 0 / 33.333% 100%,
        linear-gradient(to bottom, #444 1px, transparent 1px) 0 0 / 100% 33.333%;
    }
    .g-cell.revealed {
      opacity: 0;
    }
    .g-cell.popping {
      animation: pop-reveal 0.35s ease forwards;
    }
    @keyframes pop-reveal {
      0%   { opacity: 1; background: var(--y); }
      40%  { opacity: 1; background: var(--y); }
      100% { opacity: 0; }
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.62rem;
      letter-spacing: 2px;
      color: var(--ydim);
      border: 1px solid var(--div);
      border-top: none;
      padding: 6px 10px;
      margin-bottom: 12px;
    }
    #peek-count { color: var(--ora); }
    #round-num  { color: var(--ydim); }

    /* ── Question ── */
    .question {
      font-size: clamp(0.75rem, 2.2vw, 0.92rem);
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    /* ── Choices ── */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px) { .choices { grid-template-columns: 1fr 1fr; } }

    .choice-btn {
      background: transparent;
      border: 1px solid var(--ydim);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      letter-spacing: 1px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.4;
      transition: border-color 0.12s, background 0.12s;
    }
    .choice-btn:hover:not(:disabled):not(.eliminated) {
      border-color: var(--y);
      background: rgba(255,225,0,0.06);
    }
    .choice-btn.shake {
      animation: shake 0.35s ease;
      border-color: var(--red) !important;
      color: var(--red) !important;
    }
    .choice-btn.eliminated {
      opacity: 0.3;
      cursor: default;
      border-color: var(--div);
      color: var(--div);
    }
    .choice-btn.correct-flash {
      border-color: var(--grn) !important;
      background: rgba(68,238,68,0.15) !important;
      color: var(--grn) !important;
    }
    .choice-btn:disabled { cursor: default; }
    .ltr { color: var(--ydim); flex-shrink: 0; }
    .choice-btn.correct-flash .ltr { color: var(--grn); }
    .choice-btn.shake .ltr { color: var(--red); }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* ── Round result / Next ── */
    #round-result {
      display: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
      padding: 10px 14px;
      border: 1px solid var(--grn);
      color: var(--grn);
    }
    #next-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--y);
      color: var(--y);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 0.82rem;
      letter-spacing: 3px;
      padding: 9px 22px;
      cursor: pointer;
    }
    #next-btn:hover { background: rgba(255,225,0,0.10); }

    /* ── Score legend ── */
    .legend {
      margin-top: 10px;
      font-size: 0.6rem;
      letter-spacing: 1.5px;
      color: var(--div);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .legend span { color: var(--ydim); }

    /* ── Back ── */
    .back-links {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .back-link {
      font-size: 0.63rem;
      letter-spacing: 2px;
      color: var(--ydim);
      text-decoration: none;
    }
    .back-link:hover { color: var(--y); }
  </style>
</head>
<body>

<div class="page-hdr">
  <div class="page-title">WELLINGBOROUGH LINE &nbsp;·&nbsp; REVEAL THE LIVERY &nbsp;·&nbsp; LOUIE LINE</div>
  <div class="page-clock" id="clock">--:--:--</div>
</div>

<div class="container">

  <div class="img-wrap">
    <img id="livery-img" src="" alt="Livery">
    <div id="grid-overlay"></div>
    <div id="grid-lines"></div>
  </div>

  <div class="status-bar">
    <span>PEEKS: <span id="peek-count">0</span> / 9</span>
    <span id="round-num">ROUND 1</span>
    <span>SESSION SCORE: <span id="session-score">—</span></span>
  </div>

  <div class="question">WHICH OPERATOR'S LIVERY IS THIS?</div>
  <div class="choices" id="choices"></div>

  <div id="round-result"></div>
  <button id="next-btn" onclick="nextRound()">NEXT LIVERY →</button>

  <div class="legend">
    0 peeks: <span>EAGLE EYE</span> &nbsp;·&nbsp;
    1–3: <span>SHARP</span> &nbsp;·&nbsp;
    4–9: <span>FAIR</span> &nbsp;·&nbsp;
    10+: <span>KEEP LOOKING</span>
  </div>

  <div class="back-links">
    <a href="quizzes.html" class="back-link">◄ QUIZ MENU</a>
    <a href="index.html"   class="back-link">LIVE TRAIN BOARD ►</a>
  </div>

</div>

<script>
const CATALOGUE = [
  { slug: 'livery_avanti',             name: 'Avanti West Coast'       },
  { slug: 'livery_lner',               name: 'LNER'                    },
  { slug: 'livery_gwr',                name: 'Great Western Railway'   },
  { slug: 'livery_emr',                name: 'East Midlands Railway'   },
  { slug: 'livery_crosscountry',       name: 'CrossCountry'            },
  { slug: 'livery_hull_trains',        name: 'Hull Trains'             },
  { slug: 'livery_grand_central',      name: 'Grand Central'           },
  { slug: 'livery_heathrow_express',   name: 'Heathrow Express'        },
  { slug: 'livery_caledonian_sleeper', name: 'Caledonian Sleeper'      },
  { slug: 'livery_chiltern',           name: 'Chiltern Railways'       },
  { slug: 'livery_thameslink',         name: 'Thameslink'              },
  { slug: 'livery_southeastern',       name: 'Southeastern'            },
  { slug: 'livery_southern',           name: 'Southern'                },
  { slug: 'livery_greater_anglia',     name: 'Greater Anglia'          },
  { slug: 'livery_c2c',                name: 'c2c'                     },
  { slug: 'livery_scotrail',           name: 'ScotRail'                },
  { slug: 'livery_transpennine',       name: 'TransPennine Express',    pos: 'right center' },
  { slug: 'livery_northern',           name: 'Northern'                },
  { slug: 'livery_merseyrail',         name: 'Merseyrail'              },
  { slug: 'livery_west_midlands',      name: 'West Midlands Railway'   },
  { slug: 'livery_tfw',                name: 'Transport for Wales'     },
  { slug: 'livery_db_cargo',           name: 'DB Cargo UK'             },
  { slug: 'livery_freightliner',       name: 'Freightliner'            },
  { slug: 'livery_gbrf',               name: 'GB Railfreight'          },
  { slug: 'livery_colas',              name: 'Colas Rail'              },
  { slug: 'livery_drs',                name: 'Direct Rail Services'    },
];

const LETTERS      = ['A','B','C','D','E','F','G','H','I'];
const GRID_CELLS   = 9;

let deck          = [];
let current       = null;
let choices       = [];
let hiddenCells   = [];
let peeks         = 0;
let roundNum      = 0;
let sessionPeeks  = 0;
let sessionRounds = 0;
let locked        = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

// ── Grid ──────────────────────────────────────────────────────────────────────
function buildGrid() {
  const overlay = document.getElementById('grid-overlay');
  overlay.innerHTML = '';
  hiddenCells = [];
  for (let i = 0; i < GRID_CELLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'g-cell';
    cell.id = `gc-${i}`;
    overlay.appendChild(cell);
    hiddenCells.push(i);
  }
  // Shuffle so random removal is just pop
  hiddenCells = shuffle(hiddenCells);
}

function revealCell() {
  if (!hiddenCells.length) return;
  const idx = hiddenCells.pop();
  const el  = document.getElementById(`gc-${idx}`);
  el.classList.add('popping');
  el.addEventListener('animationend', () => el.classList.add('revealed'), { once: true });
  peeks++;
  document.getElementById('peek-count').textContent = peeks;
}

function revealAll(delay = 0) {
  [...hiddenCells].forEach((idx, i) => {
    setTimeout(() => {
      const el = document.getElementById(`gc-${idx}`);
      el.classList.add('popping');
      el.addEventListener('animationend', () => el.classList.add('revealed'), { once: true });
    }, delay + i * 28);
  });
  hiddenCells = [];
}

// ── Round ─────────────────────────────────────────────────────────────────────
function nextRound() {
  document.getElementById('round-result').style.display = 'none';
  document.getElementById('next-btn').style.display     = 'none';

  if (!deck.length) deck = shuffle([...CATALOGUE]);
  current = deck.pop();
  roundNum++;
  peeks = 0;
  locked = false;

  const img = document.getElementById('livery-img');
  img.src = `images/${current.slug}.jpg`;
  img.style.objectPosition = current.pos || 'center center';
  document.getElementById('round-num').textContent = `ROUND ${roundNum}`;
  document.getElementById('peek-count').textContent = '0';

  buildGrid();
  revealCell();

  const seenW = new Set();
  const wrongs = shuffle(CATALOGUE.filter(c => c.slug !== current.slug))
                   .filter(c => { if (seenW.has(c.name)) return false; seenW.add(c.name); return true; })
                   .slice(0, 8)
                   .map(c => c.name);
  choices = shuffle([current.name, ...wrongs]);

  document.getElementById('choices').innerHTML =
    choices.map((c, i) =>
      `<button class="choice-btn" data-choice="${escAttr(c)}" onclick="handleAnswer(this)">
        <span class="ltr">${LETTERS[i]}.</span><span>${c}</span>
       </button>`
    ).join('');
}

function handleAnswer(btn) {
  if (locked || btn.classList.contains('eliminated')) return;

  const chosen = btn.dataset.choice;

  if (chosen === current.name) {
    // Correct!
    locked = true;
    btn.classList.add('correct-flash');
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

    revealAll(180);

    sessionPeeks  += peeks;
    sessionRounds += 1;
    const avg = (sessionPeeks / sessionRounds).toFixed(1);
    document.getElementById('session-score').textContent = `avg ${avg} peeks`;

    const rating = peeks === 0 ? 'EAGLE EYE ★' : peeks <= 3 ? 'SHARP' : peeks <= 9 ? 'FAIR' : 'KEEP LOOKING';
    const res = document.getElementById('round-result');
    res.innerHTML = `✓ ${current.name.toUpperCase()} &nbsp;·&nbsp; ${peeks === 0 ? 'NO PEEKS!' : peeks + ' PEEK' + (peeks > 1 ? 'S' : '')} &nbsp;·&nbsp; ${rating}`;
    res.style.display = 'block';
    document.getElementById('next-btn').style.display = 'inline-block';

  } else {
    // Wrong — shake, eliminate, reveal a cell
    btn.classList.add('shake');
    btn.addEventListener('animationend', () => {
      btn.classList.remove('shake');
      btn.classList.add('eliminated');
      btn.disabled = true;
    }, { once: true });

    // Small delay so shake is visible before cell pops
    setTimeout(revealCell, 200);
  }
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
}
setInterval(tick, 1000);
tick();

nextRound();
</script>
</body>
</html>
